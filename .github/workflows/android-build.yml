name: android-build
# Builds the native Android app (Capacitor) for Google Play on GitHub's servers — no Java/Android tools needed on your PC.
# Same app as the iPhone version: includes the Face ID / fingerprint lock and reminder notifications.
#
# - With NO secrets set: builds with a throwaway TEST key. Proves the pipeline works; that .aab is NOT uploadable to Play.
# - With the 3 secrets below set: builds a properly signed .aab you upload to Google Play (see play-store/LAUNCH-GUIDE.md).
#     ANDROID_KEYSTORE_BASE64   the upload keystore file, base64-encoded
#     ANDROID_KEYSTORE_PASSWORD the keystore password
#     ANDROID_KEY_ALIAS         the key alias   (key password is assumed to equal the keystore password)
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Android versionCode (increase by 1 for every upload to Play)"
        default: "1"
      version_name:
        description: "Version name shown to users"
        default: "1.0.0"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Android SDK (API 36, required by Google Play)
        run: |
          sudo chmod -R a+rwX "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" > /dev/null

      - name: Copy the web app into the native project and apply Cindy's settings
        working-directory: native-app
        env:
          CINDY_VERSION_CODE: ${{ inputs.version_code }}
          CINDY_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          npm ci
          npm run sync

      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          KS="$RUNNER_TEMP/cindy-upload-key.keystore"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ]; then
            echo "Using YOUR upload key"
            echo "$KS_B64" | base64 -d > "$KS"
            echo "CINDY_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "CINDY_KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "KEYMODE=real" >> "$GITHUB_ENV"
          else
            echo "No signing secrets found — building with a throwaway TEST key (not uploadable to Play)"
            keytool -genkeypair -keystore "$KS" -alias cindy-upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass testpass123 -keypass testpass123 -dname "CN=Cindy Test, O=Test, C=US" > /dev/null
            echo "CINDY_KEYSTORE_PASSWORD=testpass123" >> "$GITHUB_ENV"
            echo "CINDY_KEY_ALIAS=cindy-upload" >> "$GITHUB_ENV"
            echo "KEYMODE=test" >> "$GITHUB_ENV"
          fi
          echo "CINDY_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Build the app bundle (.aab) and a test APK
        working-directory: native-app/android
        env:
          CINDY_VERSION_CODE: ${{ inputs.version_code }}
          CINDY_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Show the signing fingerprint
        run: |
          keytool -list -v -keystore "$CINDY_KEYSTORE_PATH" -storepass "$CINDY_KEYSTORE_PASSWORD" | grep -E "Alias name|SHA256" || true
          ls -la native-app/android/app/build/outputs/bundle/release native-app/android/app/build/outputs/apk/release

      - uses: actions/upload-artifact@v4
        with:
          name: cindy-android-${{ env.KEYMODE }}-key
          path: |
            native-app/android/app/build/outputs/bundle/release/*.aab
            native-app/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
