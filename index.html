<style>
html,body{margin:0;}
img{max-width:100%;}
[hidden]{display:none!important;}
:root{
  --ground:#eef1f4; --panel:#ffffff; --panel-2:#f5f8fa; --inset:#eceff2;
  --ink:#17232e; --muted:#5c6f7f; --faint:#8496a3; --border:#d6dde4;
  --accent:#256a86; --accent-deep:#1b5470; --accent-ghost:#e1edf1; --on-accent:#ffffff;
  --amber:#9c5f18; --amber-ghost:#f5e6d3;
  --green:#2b7a57; --green-ghost:#dbeee4;
  --violet:#565aa4; --violet-ghost:#e4e4f1;
  --danger:#a4423a; --danger-ghost:#f4e0de;
  --shadow:0 1px 2px rgba(20,35,46,.05), 0 6px 20px rgba(20,35,46,.06);
  --radius:6px;
  --maxw:940px;
  --serif:"Barlow Semi Condensed",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --body:"Barlow",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0d151d; --panel:#151f29; --panel-2:#1a2530; --inset:#1f2c38;
    --ink:#e5edf3; --muted:#8ba0b0; --faint:#6c8090; --border:#273743;
    --accent:#5bb2d1; --accent-deep:#83c8e0; --accent-ghost:#16303b; --on-accent:#08141b;
    --amber:#dda355; --amber-ghost:#372a17;
    --green:#5cc596; --green-ghost:#183025;
    --violet:#9a9ce4; --violet-ghost:#22233d;
    --danger:#e2867d; --danger-ghost:#3a221f;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#0d151d; --panel:#151f29; --panel-2:#1a2530; --inset:#1f2c38;
  --ink:#e5edf3; --muted:#8ba0b0; --faint:#6c8090; --border:#273743;
  --accent:#5bb2d1; --accent-deep:#83c8e0; --accent-ghost:#16303b; --on-accent:#08141b;
  --amber:#dda355; --amber-ghost:#372a17;
  --green:#5cc596; --green-ghost:#183025;
  --violet:#9a9ce4; --violet-ghost:#22233d;
  --danger:#e2867d; --danger-ghost:#3a221f;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{
  background:var(--ground); color:var(--ink);
  font-family:var(--body); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:var(--maxw); margin:0 auto; padding:26px 20px 96px;}
h1,h2,h3{font-family:var(--serif); font-weight:600; letter-spacing:.005em; margin:0;}
h1{font-size:24px; letter-spacing:.02em; text-transform:uppercase;}
h2{font-size:18px;}
h3{font-size:15.5px;}
p{margin:0 0 10px;}
a{color:var(--accent-deep);}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums;}

/* ---- masthead ---- */
.masthead{display:flex; align-items:baseline; justify-content:space-between; gap:14px; margin-bottom:18px; flex-wrap:wrap;}
.brand{display:flex; align-items:center; gap:12px;}
.brand-logo{width:52px; height:auto; flex:none; display:block;}
.brand-text{display:flex; flex-direction:column; gap:2px; min-width:0;}
.brand-text h1{font-size:20px; line-height:1.1;}
.auth-hero{background:#fff; border:1px solid var(--border); border-radius:14px; padding:14px 10px; margin:0 auto 18px; max-width:420px; text-align:center;}
.auth-hero img{width:100%; max-width:340px; height:auto; display:block; margin:0 auto;}
.brand .tag{font-family:var(--mono); font-size:11px; color:var(--faint); letter-spacing:.14em; text-transform:uppercase;}
.owner{font-family:var(--mono); font-size:12px; color:var(--muted);}
.iconbtn{background:transparent; border:1px solid var(--border); color:var(--muted); border-radius:var(--radius); padding:5px 9px; font-size:12px; cursor:pointer; font-family:var(--mono); text-decoration:none; display:inline-block;}
.iconbtn:hover{border-color:var(--accent); color:var(--accent-deep);}

/* ---- flight strip ---- */
.strip{display:grid; grid-template-columns:repeat(6,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:22px;}
.cell{background:var(--panel); padding:11px 12px 12px; display:flex; flex-direction:column; gap:3px;}
.cell .n{font-family:var(--mono); font-size:22px; font-weight:500; line-height:1;}
.cell .k{font-family:var(--serif); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);}
.cell.on-saved .n{color:var(--ink);}
.cell.on-tailored .n{color:var(--accent);}
.cell.on-applied .n{color:var(--green);}
.cell.on-interview .n{color:var(--violet);}
.cell.on-denied .n{color:var(--danger);}
.cell.on-closed .n{color:var(--faint);}
@media (max-width:560px){
  .strip{grid-template-columns:repeat(3,1fr);}
  .cell:nth-child(4),.cell:nth-child(5),.cell:nth-child(6){border-top:1px solid var(--border);}
}

/* ---- tabs ---- */
.tabs{display:flex; gap:2px; border-bottom:1px solid var(--border); margin-bottom:22px;}
.tab{appearance:none; background:transparent; border:none; border-bottom:2px solid transparent; margin-bottom:-1px;
  padding:9px 15px; font-family:var(--serif); font-weight:600; font-size:14px; text-transform:uppercase; letter-spacing:.06em;
  color:var(--muted); cursor:pointer;}
.tab:hover{color:var(--ink);}
.tab[aria-selected="true"]{color:var(--accent-deep); border-bottom-color:var(--accent);}
.tab .badge{font-family:var(--mono); font-size:11px; background:var(--amber-ghost); color:var(--amber); padding:1px 5px; border-radius:4px; margin-left:6px; letter-spacing:0;}

/* ---- cards ---- */
.card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; margin-bottom:16px;}
.card > h2, .card > h3{margin-bottom:4px;}
.card .lede{color:var(--muted); font-size:13.5px; margin-bottom:16px;}
.stack{display:flex; flex-direction:column; gap:14px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media (max-width:560px){ .grid2{grid-template-columns:1fr;} }

label{display:block; font-family:var(--serif); font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:5px;}
input,textarea,select{
  width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--ink);
  border-radius:var(--radius); padding:9px 11px; font-family:var(--body); font-size:14.5px;
}
textarea{resize:vertical; min-height:84px; line-height:1.5;}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);}
input::placeholder,textarea::placeholder{color:var(--faint);}
.pw-wrap{position:relative;}
.pw-wrap input{padding-right:62px;}
.pw-eye{position:absolute; top:50%; right:5px; transform:translateY(-50%); height:26px; line-height:24px; padding:0 10px; font-size:11px; background:transparent; border:1px solid var(--border); border-radius:6px; color:var(--muted); cursor:pointer;}
.pw-eye:hover{border-color:var(--accent); color:var(--accent-deep);}

button{font-family:var(--serif); font-weight:600; font-size:13.5px; text-transform:uppercase; letter-spacing:.05em;
  border:1px solid transparent; border-radius:var(--radius); padding:9px 16px; cursor:pointer;}
button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.chk-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:8px;}
.chk{display:flex !important; align-items:center; gap:10px; margin:0 !important; padding:9px 12px; border:1px solid var(--border); border-radius:8px; background:var(--panel-2); font-size:14px; text-transform:none !important; font-weight:400 !important; letter-spacing:0 !important; cursor:pointer; text-align:left;}
.chk input{width:auto !important; flex:none; margin:0;}
.apply-row input[type=checkbox]{width:auto !important; flex:none; margin:3px 4px 0 0;}
.apply-row .v{min-width:0;}
.apply-row .age{flex:none; max-width:35%; text-align:right;}
.chk:has(input:checked){border-color:var(--accent); background:var(--accent-ghost);}
.apply-backdrop{position:fixed; inset:0; background:rgba(10,18,26,.6); z-index:50; display:flex; align-items:flex-start; justify-content:center; overflow:auto; padding:24px 12px;}
.apply-modal{background:var(--panel-2); color:var(--ink); border:1px solid var(--border); border-radius:10px; max-width:720px; width:100%; padding:20px;}
.apply-modal h2{margin:0 0 4px; font-size:20px;}
.apply-row{display:flex; gap:8px; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); padding:7px 0; font-size:14px;}
.apply-row span.k{color:var(--muted); min-width:90px;}
.apply-row span.v{flex:1; word-break:break-word;}
.apply-steps{margin:10px 0; padding-left:20px; color:var(--muted); font-size:14px;}
.btn-primary{background:var(--accent); color:var(--on-accent); border-color:var(--accent);}
.btn-primary:hover{background:var(--accent-deep); border-color:var(--accent-deep);}
.btn-ghost{background:transparent; color:var(--ink); border-color:var(--border);}
.btn-ghost:hover{border-color:var(--accent); color:var(--accent-deep);}
.btn-danger{background:transparent; color:var(--danger); border-color:var(--danger);}
.btn-danger:hover{background:var(--danger-ghost);}
button:disabled{opacity:.45; cursor:not-allowed;}
a.btn-primary,a.btn-ghost,a.btn-danger{font-family:var(--serif); font-weight:600; font-size:13.5px; text-transform:uppercase; letter-spacing:.05em;
  border:1px solid transparent; border-radius:var(--radius); padding:9px 16px; cursor:pointer; text-decoration:none; display:inline-block;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
.saveflash{font-family:var(--mono); font-size:12px; color:var(--green);}

/* ---- job cards ---- */
.job{position:relative; background:var(--panel); border:1px solid var(--border); border-left-width:4px; border-radius:var(--radius); padding:16px 16px 16px 17px; margin-bottom:12px;}
.job.s-saved{border-left-color:var(--faint);}
.job.s-tailored{border-left-color:var(--accent);}
.job.s-applied{border-left-color:var(--green);}
.job.s-interview{border-left-color:var(--violet);}
.job.s-denied{border-left-color:var(--danger); opacity:.85;}
.job.s-closed{border-left-color:var(--border); opacity:.72;}
.job-head{display:flex; justify-content:space-between; gap:12px; align-items:flex-start;}
.job-head h3{font-family:var(--serif); font-size:16px;}
.job-co{font-family:var(--body); font-size:13.5px; color:var(--muted); margin-top:1px;}
.job-meta{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:9px;}
.stat{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.04em; padding:2px 7px; border-radius:4px;}
.stat.s-saved{background:var(--inset); color:var(--muted);}
.stat.s-tailored{background:var(--accent-ghost); color:var(--accent-deep);}
.stat.s-applied{background:var(--green-ghost); color:var(--green);}
.stat.s-interview{background:var(--violet-ghost); color:var(--violet);}
.stat.s-denied{background:var(--danger-ghost); color:var(--danger);}
.stat.s-closed{background:var(--inset); color:var(--faint);}
.age{font-family:var(--mono); font-size:11px; color:var(--faint);}
.job details{margin-top:11px;}
.job details summary{font-family:var(--mono); font-size:12px; color:var(--muted); cursor:pointer;}
.job details .desc{white-space:pre-wrap; font-size:13px; color:var(--muted); margin-top:8px; max-height:220px; overflow:auto; padding-right:6px;}
.job-actions{display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin-top:13px;}
.job-actions select{width:auto; padding:7px 9px; font-size:13px;}
.out{white-space:pre-wrap; font-family:var(--body); font-size:13px; line-height:1.55; background:var(--panel-2); border:1px solid var(--border); border-radius:var(--radius); padding:13px; max-height:340px; overflow:auto; margin-top:8px;}
.out-h{font-family:var(--serif); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-top:14px;}

/* ---- today ---- */
.plan{white-space:pre-wrap; font-size:14.5px; line-height:1.6;}
.thinking{font-family:var(--mono); font-size:13px; color:var(--muted);}
.stalled li{margin-bottom:6px;}
.pill{display:inline-block; font-family:var(--mono); font-size:11px; padding:1px 6px; border-radius:4px; background:var(--amber-ghost); color:var(--amber); margin-right:6px;}
.empty{color:var(--muted); font-size:13.5px; font-family:var(--body);}
.note{background:var(--accent-ghost); border:1px solid var(--accent); color:var(--accent-deep); border-radius:var(--radius); padding:11px 13px; font-size:13px; margin-bottom:14px;}

/* ---- cindy ---- */
.cindy-wrap{display:flex; flex-direction:column; gap:10px; max-height:440px; overflow-y:auto; padding-right:4px; margin-bottom:14px;}
.cindy-row{display:flex;}
.cindy-row.from-user{justify-content:flex-end;}
.cindy-row.from-cindy{align-items:flex-end; gap:8px;}
.cindy-avatar{width:38px; height:38px; flex:none; border-radius:50%; object-fit:contain; background:#fff; border:2px solid var(--accent); padding:1px;}
.cindy-avatar.lg{width:52px; height:52px;}
.cindy-head{display:flex; align-items:center; gap:12px; margin-bottom:6px;}
.cindy-head h2{margin:0;}
.cindy-bubble{max-width:82%; padding:10px 14px; border-radius:12px; font-size:14px; line-height:1.55; white-space:pre-wrap;}
.cindy-bubble.cindy{background:var(--accent-ghost); color:var(--ink); border:1px solid var(--accent); border-bottom-left-radius:3px;}
.cindy-bubble.user{background:var(--panel-2); color:var(--ink); border:1px solid var(--border); border-bottom-right-radius:3px;}
.cindy-quick{display:flex; flex-wrap:wrap; gap:8px;}
.chip{font-family:var(--serif); font-weight:600; font-size:12.5px; text-transform:none; letter-spacing:0; background:var(--panel); border:1px solid var(--accent); color:var(--accent-deep); border-radius:999px; padding:7px 14px; cursor:pointer;}
.chip:hover{background:var(--accent-ghost);}
.cindy-form{background:var(--panel-2); border:1px solid var(--border); border-radius:var(--radius); padding:14px;}

/* ---- toast ---- */
#toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(8px);
  background:var(--ink); color:var(--ground); font-size:13px; font-family:var(--body);
  padding:9px 16px; border-radius:var(--radius); box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:50; max-width:90vw;}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* ---- phones & tablets (iOS / Android) ---- */
html{-webkit-text-size-adjust:100%; text-size-adjust:100%; -webkit-tap-highlight-color:rgba(43,107,136,.15);}
body{overflow-x:hidden; overscroll-behavior-y:none;}
.wrap{padding-left:max(20px, env(safe-area-inset-left)); padding-right:max(20px, env(safe-area-inset-right)); padding-bottom:calc(96px + env(safe-area-inset-bottom));}
.out,.desc,.cindy-bubble,.apply-row .v{overflow-wrap:anywhere;}
#toast{bottom:calc(24px + env(safe-area-inset-bottom));}
.apply-backdrop{padding-top:max(24px, env(safe-area-inset-top)); padding-bottom:max(24px, env(safe-area-inset-bottom));}

/* tabs: one swipeable row instead of wrapping */
.tabs{overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; scrollbar-width:none; scroll-snap-type:x proximity;}
.tabs::-webkit-scrollbar{display:none;}
.tab{white-space:nowrap; flex:none; scroll-snap-align:start;}

/* touch devices: comfortable tap targets, and 16px inputs so iOS Safari never zooms in on focus */
@media (pointer:coarse){
  button, .btn-ghost, .btn-primary, .btn-danger, .iconbtn, .tab, select, a.btn-ghost, a.btn-primary{min-height:44px;}
  .chk{min-height:44px;}
  input[type=checkbox], input[type=radio]{min-width:20px; min-height:20px;}
}
@media (max-width:820px){
  input, textarea, select{font-size:16px;}
}

/* tablets */
@media (min-width:600px) and (max-width:1024px){
  :root{--maxw:860px;}
  .wrap{padding-top:22px;}
}

/* phones */
@media (max-width:560px){
  body{font-size:15px;}
  .wrap{padding-top:14px; padding-left:max(14px, env(safe-area-inset-left)); padding-right:max(14px, env(safe-area-inset-right));}
  .masthead{gap:8px; margin-bottom:12px;}
  .masthead .btn-row{width:100%; justify-content:flex-start;}
  .brand-logo{width:44px;}
  .brand-text h1{font-size:17px;}
  .card{padding:15px; border-radius:12px;}
  .tabs{margin-left:-14px; margin-right:-14px; padding-left:14px; padding-right:14px; margin-bottom:16px;}
  .tab{padding:10px 12px; font-size:13px;}
  .grid2{grid-template-columns:1fr !important;}
  .btn-row{gap:8px;}
  .btn-row > button, .btn-row > a.btn-ghost, .btn-row > a.btn-primary{flex:1 1 auto; text-align:center;}
  .job-actions{gap:8px;}
  .job-actions > button, .job-actions > select, .job-actions > a{flex:1 1 140px;}
  .job-head{flex-wrap:wrap;}
  .apply-row{flex-wrap:wrap;}
  .apply-row .age{max-width:100%; text-align:left; flex-basis:100%;}
  .apply-row > a.btn-ghost, .apply-row > button{margin-left:auto;}
  .chk-grid{grid-template-columns:1fr;}
  .cindy-bubble{max-width:92%;}
  /* the Apply window becomes a full-height sheet */
  .apply-backdrop{padding:0; align-items:stretch;}
  .apply-modal{border-radius:0; border-left:none; border-right:none; max-width:none; min-height:100%; padding:16px max(14px, env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom));}
  .apply-modal h2{font-size:18px;}
  .stage-group > summary{font-size:14px;}
  h1{font-size:20px;}
}
/* very small phones */
@media (max-width:360px){
  .tab{padding:10px 9px; font-size:12px;}
  .brand-text .tag{display:none;}
}
/* landscape phones: don't let the share sheet hog the screen */
@media (max-height:480px) and (orientation:landscape){
  .apply-backdrop{padding:0;}
  .wrap{padding-top:8px;}
}

/* section switcher: a dropdown menu on every screen size */
.tabmenu{display:none;}
.badge-dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--danger); margin-left:6px; vertical-align:middle;}
@media all{
  .tabs{display:none !important;}
  .tabmenu{display:block; position:relative; margin:0 0 16px; z-index:30;}
  .tabmenu-btn{width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px 16px; min-height:50px;
    background:var(--panel); color:var(--ink); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow);

    items.forEach(function(it){
      var tr = TR.map[it.key];
      if (tr){
        if (it.node){
          var lead = it.raw.match(/^\s*/)[0], trail = it.raw.match(/\s*$/)[0];
          var out = lead + tr + trail;
          it.node.nodeValue = out; TR.last.set(it.node, out);
        } else {
          it.el.setAttribute(it.attr, tr);
          var rec = TR.lastAttr.get(it.el) || {}; rec[it.attr] = tr; TR.lastAttr.set(it.el, rec);
        }
      } else if (!TR.inflight[it.key] && !TR.failed[it.key]) {
        missing[it.key] = 1;
      }
    });
    TR.applying = false;
    startObserver();
    var keys = Object.keys(missing);
    if (keys.length) trFetch(keys);
  }
  async function trFetch(keys){
    keys.forEach(function(k){ TR.inflight[k] = 1; });
    var batches = [];
    for (var i = 0; i < keys.length; i += 20) batches.push(keys.slice(i, i + 20));
    var lang = LANG;
    trPill(true);
    var next = 0;
    async function worker(){
      while (next < batches.length){
        var b = batches[next++];
        try {
          var res = await fetch(AI_BASE + "/api/translate", { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ lang:lang, strings:b }) });
          var d = await res.json();
          if (res.ok && d && Array.isArray(d.translations) && lang === LANG){
            b.forEach(function(k, j){ TR.map[k] = (d.translations[j] || k); delete TR.inflight[k]; });
          } else b.forEach(function(k){ TR.failed[k] = 1; delete TR.inflight[k]; });
        } catch(e){ b.forEach(function(k){ TR.failed[k] = 1; delete TR.inflight[k]; }); }
        if (lang === LANG){ trSave(); trRun(); }
      }
    }
    await Promise.all([worker(), worker(), worker()]);
    trPill(false);
  }

  async function sha256Hex(str){
    try {
      var enc = new TextEncoder().encode(str);
      var buf = await crypto.subtle.digest("SHA-256", enc);
      return Array.prototype.map.call(new Uint8Array(buf), function(b){ return b.toString(16).padStart(2,"0"); }).join("");
    } catch(e){
      // fallback for contexts without SubtleCrypto — not cryptographically strong,
      // but keeps the account gate working everywhere.
      var h = 0, i, chr;
      for (i=0;i<str.length;i++){ chr = str.charCodeAt(i); h = ((h<<5)-h)+chr; h|=0; }
      return "fb" + Math.abs(h).toString(16);
    }

      enterAccount(key, res.username, res.token, res.data);
      toast("Moved your account to the cloud — it’ll work from any device now.");

    } catch(e){

  async function handleLogin(){
    var u = $("#auth-user").value.trim();
    var p = $("#auth-pass").value;
    authState.username = u;
    if (!u || !p){ authState.error = "Enter a username and password."; renderAuth(); return; }

    try {
      var res = await apiRequest("/api/account/login", { method:"POST", body:{ username:u, password:p } });
      enterAccount(u.toLowerCase(), res.username, res.token, res.data);
    } catch(err){
      if (err && err.code === "not_found" && await tryMigrateLegacyAccount(u, p)) return;
      authState.error = (err && err.message) || "Something went wrong logging in.";
      renderAuth();
    }
  }

  async function handleRegister(){
    var u = $("#auth-user").value.trim();
    var p = $("#auth-pass").value;
    var p2 = $("#auth-pass2").value;
    authState.username = u;
    if (!u || u.length < 2){ authState.error = "Username needs at least 2 characters."; renderAuth(); return; }
    if (!/^[a-zA-Z0-9 _-]+$/.test(u)){ authState.error = "Use only letters, numbers, spaces, - or _."; renderAuth(); return; }
    if (!p || p.length < 4){ authState.error = "Password needs at least 4 characters."; renderAuth(); return; }
    if (p !== p2){ authState.error = "Passwords don’t match."; renderAuth(); return; }

    var key = u.toLowerCase();
    var initialData = SEED_PROFILES[key]
      ? { profile: Object.assign({ links:{} }, SEED_PROFILES[key]), activity: [], jobs: [], cindy: cindyDefault() }
      : null;

    try {
      var res = await apiRequest("/api/account/register", { method:"POST", body:{ username:u, password:p, data:initialData } });
      enterAccount(key, res.username, res.token, res.data);
    } catch(err){
      authState.error = (err && err.message) || "Something went wrong creating your account.";
      renderAuth();
    }
  }

  function onDeleteAccount(){
    var bd = document.createElement("div");
    bd.className = "apply-backdrop";
    bd.innerHTML =
      '<div class="apply-modal" role="dialog" aria-modal="true" style="max-width:460px; align-self:center;">' +
        '<h2>Delete your account?</h2>' +
        '<div class="age" style="margin:6px 0 12px;">This permanently deletes <b>'+esc(currentUserDisplay || currentUser || "")+'</b> and all its data on our servers. It can’t be undone.</div>' +
        '<label for="del-pass">Enter your password to confirm</label><div class="pw-wrap"><input id="del-pass" type="password" autocomplete="current-password"><button type="button" class="pw-eye" data-for="del-pass" aria-label="Show password">Show</button></div>' +
        '<label class="chk" style="margin-top:12px;"><input type="checkbox" id="del-ok"> I understand this is permanent</label>' +
        '<div class="age" id="del-msg" style="margin-top:8px; color:var(--danger);"></div>' +
        '<div class="btn-row" style="margin-top:14px; justify-content:space-between;"><button class="btn-ghost" id="del-cancel">Cancel</button><button class="btn-danger" id="del-go" disabled>Delete forever</button></div>' +
      '</div>';
    document.body.appendChild(bd);
    wirePasswordToggles(bd);
    function close(){ if (bd.parentNode) bd.parentNode.removeChild(bd); }
    bd.onclick = function(e){ if (e.target === bd) close(); };
    bd.querySelector("#del-cancel").onclick = close;
    bd.querySelector("#del-ok").onchange = function(){ bd.querySelector("#del-go").disabled = !bd.querySelector("#del-ok").checked; };
    bd.querySelector("#del-go").onclick = async function(){
      var pw = bd.querySelector("#del-pass").value, msg = bd.querySelector("#del-msg"), go = bd.querySelector("#del-go");
      if (!pw){ msg.textContent = "Enter your password."; return; }
      go.disabled = true; go.textContent = "Deleting…"; msg.textContent = "";
      try {
        await apiRequest("/api/account/delete", { method:"POST", body:{ username: currentUserDisplay || currentUser, password: pw } });
        try { localStorage.removeItem(userKey()); } catch(e){}
        close(); logout();
        toast("Your account was deleted.");
      } catch(e){
        msg.textContent = (e && e.message) || "That didn’t work. Check your password.";
        go.disabled = false; go.textContent = "Delete forever";
      }
    };
  }

  function tabDefs(unread){

  function tabsHtml(unread){
    var defs = tabDefs(unread);
    var cur = defs.filter(function(d){ return d.key === activeTab; })[0] || defs[0];
    var otherUnread = unread && activeTab !== "activity";
    return '<div class="tabs" role="tablist">' + defs.map(function(d){ return tabBtn(d.key, d.label, d.badge); }).join("") + '</div>' +

  var tabMenuListenersAdded = false;
  function wireTabMenu(){
    var btn = $("#tabmenu-btn"), list = $("#tabmenu-list");
    if (!btn || !list) return;
    function setOpen(open){ list.hidden = !open; btn.setAttribute("aria-expanded", open ? "true" : "false"); $("#tabmenu").classList.toggle("open", open); }
    btn.onclick = function(e){ e.stopPropagation(); setOpen(list.hidden); };
    Array.prototype.forEach.call(list.querySelectorAll(".tabmenu-opt"), function(o){
      o.onclick = function(){ activeTab = o.dataset.tab; render(); window.scrollTo(0, 0); };
    });
    if (!tabMenuListenersAdded){
      tabMenuListenersAdded = true;
      document.addEventListener("click", function(e){
        var l = $("#tabmenu-list"), b2 = $("#tabmenu-btn");
        if (l && !l.hidden && !(l.contains(e.target) || (b2 && b2.contains(e.target)))){ l.hidden = true; if (b2) b2.setAttribute("aria-expanded","false"); }
      });
      document.addEventListener("keydown", function(e){
        if (e.key === "Escape"){ var l = $("#tabmenu-list"); if (l && !l.hidden){ l.hidden = true; var b2 = $("#tabmenu-btn"); if (b2){ b2.setAttribute("aria-expanded","false"); b2.focus(); } } }
      });
    }
  }

  async function buildPlan(){
    if (!AI_ENABLED || planCache.running) return;
    var lines = sortedJobs().map(function(j){
      var bits = "- " + j.title + " @ " + j.company + " | " + stageLabel(j.status);
      if (j.tailoredResume) bits += " | materials ready";
      var age = agoLabel(j.createdAt); if (age) bits += " | added " + age;
      if (j.appliedAt) bits += " | applied " + agoLabel(j.appliedAt);
      return bits;
    }).join("\n");

    planCache.running = true; planCache.text = ""; planCache.ctl = new AbortController();
    renderToday($("#tab-body"));
    try {
      var res = await aiRequest("/api/plan", {
        pipeline: lines,
        targetRoles: state.profile.targetRoles || "",
        location: state.profile.location || ""
      }, planCache.ctl.signal);
      planCache.text = String(res && res.text || "").trim() || "No plan came back — try again.";
    } catch(e){
      if (!(e && e.name === "AbortError")) toast((e && e.message) || "That didn’t go through. Try again in a moment.");
    } finally {
      planCache.running = false; planCache.ctl = null;
      renderToday($("#tab-body"));
    }
  }

  async function onCindyResumeUpload(e){
    var f = e.target.files[0]; if (!f) return;
    var isPdf = /\.pdf$/i.test(f.name || "");
    if (isPdf) toast("Reading PDF…");
    try {
      var text = await extractResumeFile(f);
      state.cindy.draft.uploadedText = text;
      cindyPush("cindy", "Got it — here’s what I pulled from “" + f.name + "”. Take a look, fix anything that came through wrong, and save it when it’s ready.");

    } catch(err){
      cindyPush("cindy", (err && err.message) || "Couldn’t read that file — try a .txt, .md, or text-based .pdf.");
    }
    e.target.value = "";
    persistMain(); render();
  }

  function compileResume(d){
    var lines = [];
    var c = d.contact || {};
    lines.push(c.name || "Your Name");
    var bits = [c.location, c.email, c.phone, c.links].filter(Boolean);
    if (bits.length) lines.push(bits.join(" · "));
    lines.push("");
    if (d.summary){ lines.push("SUMMARY"); lines.push(d.summary); lines.push(""); }
    if (d.experience && d.experience.length){
      lines.push("EXPERIENCE");
      d.experience.forEach(function(e){
        lines.push((e.title||"Role") + " — " + (e.company||"Company") + (e.dates ? " (" + e.dates + ")" : ""));
        String(e.bullets||"").split("\n").map(function(s){ return s.trim(); }).filter(Boolean).forEach(function(bul){ lines.push("- " + bul); });
        lines.push("");
      });
    }
    if (d.education && d.education.length){
      lines.push("EDUCATION");
      d.education.forEach(function(ed){
        lines.push((ed.degree||"") + (ed.degree && ed.school ? ", " : "") + (ed.school||"") + (ed.dates ? " (" + ed.dates + ")" : ""));
      });
      lines.push("");
    }
    if (d.skills){ lines.push("SKILLS"); lines.push(d.skills); }
    return lines.join("\n").replace(/\n{3,}/g, "\n\n").trim();
  }

  async function onCindySend(){
    var input = $("#cindy-input");
    var text = input.value.trim();
    if (!text) return;
    cindyPush("user", text);
    input.value = "";

    if (AI_ENABLED){
      cindyBusy = true; render();
      try {
        var res = await aiRequest("/api/cindy", { message:text, history: state.cindy.history.slice(-20) });
        cindyPush("cindy", String(res && res.text || "").trim() || "Hmm, nothing came back — try again?");
      } catch(e){
        cindyPush("cindy", (e && e.message) || "That didn’t go through. Try again in a moment.");
      } finally {
        cindyBusy = false;
      }
      persistMain(); render();
      return;
    }

    var t = text.toLowerCase();
    if (/resum|\bcv\b/.test(t)){ startResumeBuilder(); return; }
    if (/cover letter/.test(t)){
      cindyPush("cindy", "Cover letters come together fastest once a specific job's on your Pipeline — add it there and hit Tailor, and I'll draft one alongside your résumé once the AI backend's connected.");
    } else if (/next|what should i do/.test(t)){ cindyNextSteps(); return; }
    else if (/pep|motivat|discourag|down|tired/.test(t)){ cindyPepTalk(); return; }
    else if (/credit|score|collection|debt/.test(t)){ cindyTip("credit"); return; }
    else if (/grant|assistance|benefit|help paying/.test(t)){ cindyTip("grants"); return; }
    else if (/tip/.test(t)){ cindyTip(); return; }
    else {
      cindyPush("cindy", "I run on built-in guidance on this static build, so I do best with the buttons below — but I can build a résumé, look at your pipeline, or talk you off the ledge. What sounds useful?");
    }
    persistMain(); render();
  }

  // Jobs grouped by stage: active stages open, finished ones (denied / closed) collapsed.
  var groupOpen = {};
  function groupedJobsHtml(jobs){
    var order = ["interview","tailored","saved","applied","denied","closed"];
    return order.map(function(key){
      var list = jobs.filter(function(j){ return (j.status || "saved") === key; });
      if (!list.length) return "";
      var open = groupOpen[key] != null ? groupOpen[key] : (key !== "denied" && key !== "closed");
      return '<details class="stage-group" data-stage="'+key+'"'+(open ? " open" : "")+' style="margin-bottom:14px;">' +
        '<summary style="cursor:pointer; font-weight:700; font-size:15px; padding:8px 2px;"><span class="stat s-'+key+'" style="margin-right:8px;">'+esc(stageLabel(key))+'</span>'+list.length+(list.length===1 ? " job" : " jobs")+'</summary>' +
        list.map(jobCard).join("") + '</details>';
    }).join("");
  }

  function findJob(id){ return state.jobs.filter(function(j){ return j.id===id; })[0]; }

  function wireJobCards(){
    Array.prototype.forEach.call(document.querySelectorAll(".job"), function(el){
      var id = el.dataset.id;
      var del = $(".j-del", el); if (del) del.onclick = function(){ onDeleteJob(id); };
      var sel = $(".j-status", el); if (sel) sel.onchange = function(){ onStatusChange(id, sel.value); };
      var apv = $(".j-approve", el); if (apv) apv.onchange = function(){ onApprove(id, apv.checked); };
      var sd = $(".j-savedesc", el); if (sd) sd.onclick = async function(){
        var j = findJob(id); j.description = ($(".j-fulldesc", el).value || "").trim().slice(0, 6000); j.updatedAt = now();
        await persistJob(j); toast("Saved — hit Re-tailor (under More options) to use it."); render();
      };
      var su = $(".j-saveurl", el); if (su) su.onclick = async function(){
        var u = ($(".j-applyurl", el).value || "").trim(); var j = findJob(id);
        if (u && (!/^https:\/\//i.test(u) || isBlockedHost(u))){ toast("Use the company’s own https:// application link — not LinkedIn, Indeed, Adzuna or other job boards."); return; }
        j.applyUrl = u; j.updatedAt = now(); await persistJob(j); toast(u ? "Saved — you can now let the bot apply." : "Link removed."); render();
      };
      var cv = $(".j-cover", el); if (cv) cv.onclick = function(){ onCoverLetter(id, cv, $(".j-tone", el).value); };
      var ap = $(".j-apply", el); if (ap) ap.onclick = function(){ onApply(id, ap); };
      var tl = $(".j-tailor", el); if (tl) tl.onclick = function(){ onTailor(id, tl); };
      var cr = $(".j-copy-r", el); if (cr) cr.onclick = function(){ copyText(findJob(id).tailoredResume); };
      var cc = $(".j-copy-c", el); if (cc) cc.onclick = function(){ copyText(findJob(id).coverLetter); };
      var dr = $(".j-dl-r", el); if (dr) dr.onclick = function(){ var j=findJob(id); saveFile(fileName(j,"resume"), j.tailoredResume); };
      var dc = $(".j-dl-c", el); if (dc) dc.onclick = function(){ var j=findJob(id); saveFile(fileName(j,"cover-letter"), j.coverLetter); };
    });
  }

  function fileName(j, kind){
    var slug = (j.company + "-" + j.title + "-" + kind).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
    return slug.slice(0,80) + ".txt";
  }

  async function onAddJob(){
    var title = $("#j-title").value.trim();
    var company = $("#j-company").value.trim();
    var url = $("#j-url").value.trim();
    var description = $("#j-desc").value.trim();
    if (!title || !company){ toast("Job title and company are required."); return; }
    var job = { id:uid(), title:title, company:company, url:url, description:description,
      status:"saved", tailoredResume:"", coverLetter:"", createdAt:now(), updatedAt:now(), appliedAt:null };
    state.jobs.unshift(job);
    await persistJob(job);
    await pushActivity("Added " + title + " at " + company + " to the pipeline.", job.id);
    render();
  }

  async function onDeleteJob(id){
    var j = findJob(id);
    if (!j) return;
    if (!confirm("Remove “" + j.title + " — " + j.company + "” from the pipeline?")) return;
    state.jobs = state.jobs.filter(function(x){ return x.id!==id; });
    await removeJobRemote(id);
    render();
  }

  async function onStatusChange(id, status){
    var j = findJob(id);
    if (!j) return;
    j.status = status;
    j.updatedAt = now();
    if (status==="applied" && !j.appliedAt) j.appliedAt = now();
    if (status==="denied" && !j.deniedAt) j.deniedAt = now();
    await persistJob(j);
    await pushActivity("Moved " + j.title + " → " + stageLabel(status) + ".", id);
    render();
  }

  async function onTailor(id, btn){
    var j = findJob(id);
    if (!j) return;
    if (!AI_ENABLED){ toast("This static site can’t run AI tailoring — draft it yourself or ask an AI assistant directly."); return; }
    var resume = resumeWithCerts();
    if (!resume.trim()){ toast("Add your résumé in the Profile tab first."); activeTab="profile"; render(); return; }

    btn.disabled = true; btn.textContent = "Tailoring…";
    try {
      var data = await aiRequest("/api/tailor", {
        resume: resume.slice(0, 6500),
        title: j.title,
        company: j.company,
        description: (j.description || "").slice(0, 6500)
      });
      j.tailoredResume = String(data && data.resume || "").trim();
      j.coverLetter = String(data && data.coverLetter || "").trim();
      if (!j.tailoredResume && !j.coverLetter) throw new Error("The reply came back empty. Try again.");
      j.updatedAt = now();
      if (j.status==="saved") j.status = "tailored";
      await persistJob(j);
      await pushActivity("Tailored résumé + cover letter for " + j.title + " at " + j.company + ".", id);
      toast("Materials ready — review before you send.");
      render();
    } catch(e){
      toast((e && e.message) || "That didn’t go through. Try again.");
      btn.disabled = false; btn.textContent = j.tailoredResume ? "Re-tailor" : "Tailor résumé + cover letter";
    }
  }

  // ---------- Apply assistant: tailor if needed, show a ready packet, open the posting; the user submits ----------
  async function onCoverLetter(id, btn, tone){
    var j = findJob(id);
    if (!j) return;
    var resume = resumeWithCerts();
    if (!resume.trim()){ toast("Add your résumé in the Profile tab first."); activeTab="profile"; render(); return; }
    btn.disabled = true; btn.textContent = "Writing…";
    try {
      var data = await aiRequest("/api/coverletter", {
        resume: resume.slice(0, 6500), template: (state.profile.coverLetterText || "").slice(0, 3000),
        title: j.title, company: j.company, description: (j.description || "").slice(0, 6000),
        name: state.profile.name || "", tone: tone
      });
      var text = String(data && data.coverLetter || "").trim();
      if (!text) throw new Error("The reply came back empty. Try again.");
      j.coverLetter = text; j.updatedAt = now();
      await persistJob(j);
      await pushActivity("Wrote a cover letter for " + j.title + " at " + j.company + ".", id);
      toast("Cover letter ready — review it before you send.");
      render();
    } catch(e){
      toast((e && e.message) || "That didn’t go through. Try again.");
      btn.disabled = false; btn.textContent = "Write cover letter";
    }
  }

  async function onApply(id, btn){
    var j = findJob(id);
    if (!j) return;
    if (!j.tailoredResume || !j.coverLetter){
      var old = btn.textContent; btn.disabled = true; btn.textContent = "Preparing…";
      await onTailor(id, btn);
      j = findJob(id);
      if (!j.tailoredResume){ btn.disabled = false; btn.textContent = old; return; }
    }
    openApplyModal(j);
  }

  function openApplyModal(j){
    var p = state.profile || {}, L = p.links || {};
    var rows = [["Name", p.name], ["Email", p.email], ["Phone", p.phone], ["Location", p.location],
      ["LinkedIn", L.linkedin], ["Website", L.portfolio]].filter(function(r){ return r[1]; });
    var bd = document.createElement("div");

    bd.innerHTML =
      '<div class="apply-modal" role="dialog" aria-modal="true">' +

        (rows.length < 3 ? '<div class="age" style="margin:6px 0;">Fill in your contact info in the Profile tab so it shows up here.</div>' : "") +
        '<div class="out-h">Tailored résumé</div><div class="out">'+esc(j.tailoredResume)+'</div>' +
        '<div class="btn-row" style="margin-top:8px;"><button class="btn-ghost" id="ap-cr">Copy</button><button class="btn-ghost" id="ap-dr">Download .txt</button></div>' +
        '<div class="out-h">Cover letter</div><div class="out">'+esc(j.coverLetter)+'</div>' +
        '<div class="btn-row" style="margin-top:8px;"><button class="btn-ghost" id="ap-cc">Copy</button><button class="btn-ghost" id="ap-dc">Download .txt</button></div>' +
        (botUrl(j) ? (
          '<div class="out-h">Auto-apply (beta)</div>' +
          '<div class="age" style="margin:4px 0 8px;">The bot fills the employer’s own form with the info above. It stops and tells you if there’s a CAPTCHA or a question it can’t answer, and it doesn’t work on LinkedIn or Indeed.</div>' +
          '<div class="btn-row"><button class="btn-ghost" id="ap-dry">Practice run (won’t submit)</button>' +
          '<button class="btn-primary" id="ap-auto">Auto-apply for me</button></div>' +
          '<div class="age" id="ap-status" style="margin-top:8px;"></div>'
        ) : (
          '<div class="out-h">Auto-apply isn’t available for this job</div>' +
          '<div class="age" style="margin:4px 0 8px;">The bot works on <b>Greenhouse, Lever and Ashby</b> application pages. This job is on a job board or another company system (such as Workday or Phenom) that needs an account or a multi-step sign-in, and the bot never creates accounts. Apply by hand with the résumé and cover letter above. To use the bot, press <b>Find the company’s page</b>, or <b>find jobs the bot can apply to</b>. If you already have a Greenhouse, Lever or Ashby link for this job, paste it here:</div>' +
          '<div class="btn-row"><input id="ap-link" style="flex:1; min-width:200px;" placeholder="https://…"><button class="btn-primary" id="ap-savelink">Save link</button></div>' +
          '<div class="btn-row" style="margin-top:8px;"><button class="btn-ghost" id="ap-find">Find the company’s page for me</button><button class="btn-ghost" id="ap-ready">Find jobs the bot can apply to</button></div>' +
          '<div class="age" id="ap-linkmsg" style="margin-top:6px;"></div>'
        )) +
        '<div id="ap-qs" style="margin-top:8px;"></div>' +
        '<details id="es-box" style="margin-top:14px;"><summary class="age" style="cursor:pointer;">Need help with an essay question?</summary>' +
          '<div class="age" style="margin:6px 0;">Paste a question from the application and Cindy drafts an answer from your résumé. Edit it so it’s true and in your own voice — and check the employer’s rules first, since some forbid AI-written answers.</div>' +
          '<textarea id="es-q" rows="3" placeholder="Paste the question here…"></textarea>' +
          '<div class="btn-row" style="margin-top:6px;"><button class="btn-ghost" id="es-go">Draft my answer</button><button class="btn-ghost" id="es-copy" style="display:none;">Copy</button></div>' +
          '<div class="out" id="es-out" style="display:none; margin-top:8px;"></div>' +
        '</details>' +
        '<div class="btn-row" style="margin-top:18px; justify-content:space-between;">' +
          '<button class="btn-ghost" id="ap-close">Close</button>' +
          '<button class="btn-primary" id="ap-done">I submitted it ✓</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(bd);
    function close(){ if (bd.parentNode) bd.parentNode.removeChild(bd); }
    bd.onclick = function(e){ if (e.target === bd) close(); };
    Array.prototype.forEach.call(bd.querySelectorAll("[data-copy]"), function(b){ b.onclick = function(){ copyText(rows[+b.dataset.copy][1]); }; });
    bd.querySelector("#ap-cr").onclick = function(){ copyText(j.tailoredResume); };
    bd.querySelector("#ap-cc").onclick = function(){ copyText(j.coverLetter); };
    bd.querySelector("#ap-dr").onclick = function(){ saveFile(fileName(j,"resume"), j.tailoredResume); };
    bd.querySelector("#ap-dc").onclick = function(){ saveFile(fileName(j,"cover-letter"), j.coverLetter); };
    bd.querySelector("#ap-close").onclick = close;
    var stEl = bd.querySelector("#ap-status");
    async function runBot(mode){
      if (mode === "submit" && !confirm("The bot will SUBMIT your application to " + j.company + " for “" + j.title + "”. This can’t be undone. Continue?")) return;
      var btns = bd.querySelectorAll("#ap-dry,#ap-auto");
      function setBtns(d){ Array.prototype.forEach.call(btns, function(x){ x.disabled = d; }); }
      setBtns(true);
      stEl.textContent = "Starting the bot…";
      try {
        var r = await apiRequest("/api/autoapply", { method:"POST", token:authToken, body:{
          url:botUrl(j), title:j.title, company:j.company, mode:mode, resume:j.tailoredResume, coverLetter:j.coverLetter,
          profile:{ name:p.name, email:p.email, phone:p.phone, location:p.location, linkedin:L.linkedin, website:L.portfolio }, answers:(p.answers || {}) } });
        var tries = 0;
        var iv = setInterval(async function(){
          tries++;
          try {
            var s2 = await apiRequest("/api/autoapply?id=" + r.id, { token:authToken });
            var done = ["submitted","dry_run_ok","needs_you","failed"].indexOf(s2.status) !== -1;
            var secs = tries * 4;
            stEl.textContent = s2.message + (s2.status === "queued" ? " (" + secs + "s — starting the bot takes about a minute; status can lag a bit)" : "") +
              (s2.filled && s2.filled.length ? " Filled: " + s2.filled.length + " fields." : "") +
              (s2.missing && s2.missing.length ? " " + s2.missing.length + " question(s) are left for you (below)." : "");
            var qsBox = bd.querySelector("#ap-qs");
            if (qsBox && s2.missing && s2.missing.length){
              qsBox.innerHTML = '<div class="out-h">Questions the bot left for you</div>' +

              Array.prototype.forEach.call(qsBox.querySelectorAll(".ap-qdraft"), function(b2){
                b2.onclick = function(){ bd.querySelector("#es-q").value = s2.missing[parseInt(b2.dataset.qi, 10)]; bd.querySelector("#es-box").open = true; bd.querySelector("#es-go").click(); };
              });
            }
            if (done || tries > 90){
              clearInterval(iv); setBtns(false);
              if (s2.status === "submitted"){ await onStatusChange(j.id, "applied"); toast("Submitted — logged as applied."); }
            }
          } catch(e){ /* keep polling */ }
        }, 4000);
      } catch(e){
        stEl.textContent = (e && e.message) || "Couldn’t start the bot.";
        setBtns(false);
      }
    }
    var esGo = bd.querySelector("#es-go");
    if (esGo) esGo.onclick = async function(){
      var q = (bd.querySelector("#es-q").value || "").trim();
      if (q.length < 8){ toast("Paste the question first."); return; }
      var outEl = bd.querySelector("#es-out"), cpBtn = bd.querySelector("#es-copy");
      esGo.disabled = true; esGo.textContent = "Writing…";
      try {
        var d = await aiRequest("/api/money", { kind:"essay", question:q, title:j.title, company:j.company, description:(j.description||"").slice(0,1500), resume:resumeWithCerts() });
        var ans = String(d.answer || "").trim();
        outEl.textContent = ans; outEl.style.display = ans ? "block" : "none";
        cpBtn.style.display = ans ? "inline-block" : "none";
        cpBtn.onclick = function(){ copyText(ans); };
      } catch(e){ toast((e && e.message) || "That didn’t go through. Try again."); }
      esGo.disabled = false; esGo.textContent = "Draft my answer";
    };
    var sl = bd.querySelector("#ap-savelink"); if (sl) sl.onclick = async function(){
      var u = (bd.querySelector("#ap-link").value || "").trim();
      var msg = bd.querySelector("#ap-linkmsg");
      if (!/^https:\/\//i.test(u) || isBlockedHost(u) || !autoApplyOk(u)){ msg.textContent = "The bot only works on Greenhouse, Lever and Ashby application links (greenhouse.io, lever.co, ashbyhq.com). For any other site, apply by hand using the materials above."; return; }
      j.applyUrl = u; j.updatedAt = now();
      await persistJob(j);
      close();
      openApplyModal(j);
      toast("Link saved — the Auto-apply buttons are now available.");
    };
    var fd = bd.querySelector("#ap-find"); if (fd) fd.onclick = async function(){
      var msg = bd.querySelector("#ap-linkmsg");
      fd.disabled = true; fd.textContent = "Searching…"; msg.textContent = "";
      try {
        var res = await fetch(AI_BASE + "/api/findapply?company=" + encodeURIComponent(j.company || "") + "&title=" + encodeURIComponent(j.title || ""));
        var f = await res.json();
        if (f && f.url && !isBlockedHost(f.url) && autoApplyOk(f.url)){
          j.applyUrl = f.url; j.updatedAt = now(); await persistJob(j);
          close(); openApplyModal(j);
          toast("Found the company’s own page — the Auto-apply buttons are now available.");
          return;
        }
        msg.textContent = "Couldn’t find a company-hosted application page for this one (many small employers only use job boards). You can still apply by hand with the materials above.";
      } catch(e){ msg.textContent = "Couldn’t search right now. Try again in a moment."; }
      fd.disabled = false; fd.textContent = "Find the company’s page for me";
    };
    var rd = bd.querySelector("#ap-ready"); if (rd) rd.onclick = function(){ close(); matchesCache.ats = true; activeTab = "matches"; render(); window.scrollTo(0, 0); toast("Search with the ‘Only jobs the bot can apply to’ box ticked."); };

  function isBlockedHost(u){
    try { return /(^|\.)(linkedin|indeed|adzuna|ziprecruiter|glassdoor|monster|simplyhired|remotive|remoteok|jobicy|himalayas|weworkremotely|themuse|arbeitnow|flexjobs)\.(com|co\.uk|io|app)$/i.test(new URL(u).hostname); } catch(e){ return true; }
  }
  // The bot only works on application systems it has been built and tested for: Greenhouse, Lever and Ashby.
  // Other company systems (Workday, Phenom, iCIMS, Taleo...) need an account or a multi-step login, which the bot never creates.
  function autoApplyOk(u){
    try { return /(^|\.)(greenhouse\.io|lever\.co|ashbyhq\.com)$/i.test(new URL(u).hostname); } catch(e){ return false; }
  }
  function botUrl(j){
    var cands = [j.applyUrl, j.url];
    for (var i=0; i<cands.length; i++){
      var u = cands[i];
      if (u && /^https:\/\//i.test(u) && !isBlockedHost(u) && autoApplyOk(u)) return u;
    }
    return "";
  }

  async function ensureMaterials(j){
    if (j.tailoredResume && j.coverLetter) return true;
    var resume = resumeWithCerts();

    var d = await aiRequest("/api/tailor", { resume:resume.slice(0, 6500), title:j.title, company:j.company, description:(j.description || "").slice(0, 6500) });
    j.tailoredResume = String(d && d.resume || "").trim();

  async function runBotJob(j, mode, onProgress){
    var p = state.profile || {}, L = p.links || {};
    var r = await apiRequest("/api/autoapply", { method:"POST", token:authToken, body:{
      url:botUrl(j), title:j.title, company:j.company, mode:mode, resume:j.tailoredResume, coverLetter:j.coverLetter,
      profile:{ name:p.name, email:p.email, phone:p.phone, location:p.location, linkedin:L.linkedin, website:L.portfolio }, answers:(p.answers || {}) } });
    for (var i=0; i<90; i++){
      await new Promise(function(res){ setTimeout(res, 4000); });
      var s2 = await apiRequest("/api/autoapply?id=" + r.id, { token:authToken }).catch(function(){ return null; });
      if (!s2) continue;
      if (onProgress) onProgress(s2);
      if (["submitted","dry_run_ok","needs_you","failed"].indexOf(s2.status) !== -1) return s2;
    }
    return { status:"failed", message:"Timed out waiting for the bot." };
  }

  async function onSubmitApproved(){
    var q = approvedJobs();
    if (!q.length || queueRunning) return;
    if (!(state.profile.name && state.profile.email)){ toast("Add your name and email in Profile first."); activeTab="profile"; render(); return; }
    if (!confirm("The bot will SUBMIT applications to "+q.length+" job(s): " + q.map(function(j){ return j.company; }).join(", ") + ". Submissions can’t be undone. Continue?")) return;
    queueRunning = true; render();
    var done = 0;
    for (var i=0; i<q.length; i++){
      var j = q[i];
      try {
        j.botNote = "Preparing materials…"; render();
        if (!(await ensureMaterials(j))){ j.botNote = "Add your résumé in Profile"; continue; }
        j.botNote = "Bot is applying…"; render();
        var res = await runBotJob(j, "submit", function(st){ j.botNote = st.message; });
        j.botNote = res.message;
        if (res.status === "submitted"){
          j.approved = false; j.status = "applied"; j.appliedAt = j.appliedAt || now(); j.updatedAt = now();
          await pushActivity("Auto-applied to " + j.title + " at " + j.company + ".", j.id);
          done++;
        } else {
          j.approved = false; // needs a human now — take it out of the queue
          await pushActivity("Auto-apply paused on " + j.title + " at " + j.company + ": " + res.message, j.id);
        }
      } catch(e){
        j.botNote = (e && e.message) || "Error"; j.approved = false;
      }
      await persistJob(j); render();
    }
    queueRunning = false; render();
    toast(done + " of " + q.length + " submitted. Anything else is waiting for you in the pipeline.");
  }

  function buildLetter(d){
    var date = new Date().toLocaleDateString("en-US", { year:"numeric", month:"long", day:"numeric" });
    var head = d.name + "\n" + d.address + "\n\n" + date + "\n\n";
    var acct = d.account ? "Account/reference: " + d.account + "\n\n" : "\n";
    var to, body;
    if (d.type === "dispute"){
      to = BUREAUS.filter(function(x){ return x.name===d.bureau; })[0].addr + "\n\n";
      body = "RE: Dispute of inaccurate information on my credit report\n" + acct +
        "To whom it may concern:\n\nI am writing under Section 611 of the Fair Credit Reporting Act to dispute information in my credit file that is inaccurate or cannot be verified:\n\n" +
        (d.detail || "[Describe the item, the account name, and what is wrong.]") + "\n\n" +
        "Please conduct a reasonable investigation, correct or delete the information if it is inaccurate, incomplete, or cannot be verified, and send me the results in writing along with an updated copy of my report. I have enclosed copies of supporting documents.\n\nSincerely,\n" + d.name;
    } else if (d.type === "furnisher"){
      to = (d.company || "[Company name and address]") + "\n\n";
      body = "RE: Dispute of inaccurate information reported to credit bureaus\n" + acct +
        "To whom it may concern:\n\nI am disputing information you reported to the consumer reporting agencies, which I believe is inaccurate:\n\n" +
        (d.detail || "[Describe the item and what is wrong.]") + "\n\n" +
        "Under the Fair Credit Reporting Act, please investigate, correct or delete anything inaccurate or unverifiable, notify each credit bureau you reported to, and send me written confirmation of the result.\n\nSincerely,\n" + d.name;
    } else if (d.type === "validate"){
      to = (d.company || "[Collector name and address]") + "\n\n";
      body = "RE: Request for validation of debt\n" + acct +
        "To whom it may concern:\n\nI received a communication from you about a debt. Under Section 809(b) of the Fair Debt Collection Practices Act, I request validation of this debt. Please send me, in writing: the amount you claim I owe and how it was calculated; the name of the original creditor and the account number; proof that you are authorized to collect it; and a copy of any agreement or statement showing I owe it.\n\n" +
        "Until you provide this, please stop collection activity and do not report this debt to any credit bureau. This letter is not an admission that I owe the debt. " + (d.detail || "") + "\n\nSincerely,\n" + d.name;
    } else {
      to = (d.company || "[Creditor name and address]") + "\n\n";
      body = "RE: Goodwill adjustment request\n" + acct +
        "Dear Customer Relations,\n\nI have been a customer and I value the relationship. I am writing to ask for a goodwill adjustment on a late payment on this account:\n\n" +
        (d.detail || "[Briefly and honestly explain what happened.]") + "\n\n" +
        "Since then I have kept the account in good standing. I would be grateful if you would remove the late-payment mark from my credit reports as a courtesy. Thank you for considering this.\n\nSincerely,\n" + d.name;
    }
    return head + to + body;
  }

  // ----- Résumé match score (runs on your device; no AI, no upload) -----
  var MS_STOP = ("a able about above across after all also an and any are as at be been but by can could did do does each etc for from had has have her his how if in into is it its may more most must new no not of on one or our out over per such than that the their them then there these they this to up us use used using was we well were what when where which while who will with within without would you your " +
    "need needs want wants job role position work working works team teams company candidate candidates ideal looking seeking responsible responsibilities requirements required preferred qualifications qualification strong ability experience years year plus including include includes etc like make help provide support ensure join opportunity benefits equal employer apply applicants applicant day days time full part salary").split(" ");
  var MS_STOPSET = {}; MS_STOP.forEach(function(w){ MS_STOPSET[w] = 1; });
  function msStem(w){
    if (w.length > 5 && /ing$/.test(w)) return w.slice(0, -3);
    if (w.length > 4 && /ies$/.test(w)) return w.slice(0, -3) + "y";
    if (w.length > 4 && /ed$/.test(w)) return w.slice(0, -2);
    if (w.length > 3 && /s$/.test(w) && !/ss$/.test(w)) return w.slice(0, -1);
    return w;
  }
  function msTokens(text){
    return (String(text || "").toLowerCase().match(/[a-z][a-z0-9+#]*/g) || []).filter(function(w){ return w.length >= 3 && !MS_STOPSET[w]; });
  }
  function matchScore(jd, resume){
    var freq = {}, order = [], shown = {};
    msTokens(jd).forEach(function(w){ var s = msStem(w); if (!freq[s]){ freq[s] = 0; order.push(s); shown[s] = w; } freq[s]++; });
    var top = order.slice().sort(function(a,b){ return freq[b] - freq[a] || order.indexOf(a) - order.indexOf(b); }).slice(0, 30);
    var have = {}; msTokens(resume).forEach(function(w){ have[msStem(w)] = 1; });
    var hit = top.filter(function(k){ return have[k]; }), miss = top.filter(function(k){ return !have[k]; });
    var pct = top.length ? Math.round(hit.length / top.length * 100) : 0;
    var words = String(resume || "").trim().split(/\s+/).filter(Boolean).length;
    var checks = [
      [/@/.test(resume), "An email address is on the résumé"],
      [/\(?\d{3}\)?[\s.-]*\d{3}[\s.-]*\d{4}/.test(resume), "A phone number is on the résumé"],
      [/experience|employment|work history/i.test(resume), "An Experience section"],
      [/education|school|university|college|degree/i.test(resume), "An Education section"],
      [/skills/i.test(resume), "A Skills section"],
      [(String(resume).match(/\d+%?/g) || []).length >= 5, "Numbers that show results (5 or more)"],
      [words >= 250 && words <= 1000, "A reasonable length (about 250 to 1,000 words; yours: " + words + ")"]
    ];
    return { pct:pct, hit:hit.map(function(k){ return shown[k]; }), miss:miss.map(function(k){ return shown[k]; }), checks:checks, count:top.length };
  }
  function renderMatchScore(host){
    host.innerHTML =
      '<div class="card"><h3>Résumé match score</h3>' +
        '<div class="lede">Paste a job description (or pick a Pipeline job) and see how many of its key words your résumé already uses. It runs on your device. This is a keyword check, not an official ATS score: employers’ systems differ.</div>' +
        '<div class="stack"><div>'+jobPickerHtml("ms-job","")+'</div>' +
        '<div><label for="ms-jd">Job description</label><textarea id="ms-jd" rows="6" placeholder="Paste the job posting here…"></textarea></div>' +
        '<div><label for="ms-res">Résumé <span style="text-transform:none; font-weight:400;">(from your Profile; edit here for a one-off check)</span></label><textarea id="ms-res" rows="5">'+esc(state.profile.resumeText || "")+'</textarea></div>' +
        '<div class="btn-row"><button class="btn-primary" id="ms-go">Check my match</button></div></div></div><div id="ms-out"></div>';
    $("#ms-job").onchange = function(){ var j = jobById(this.value); if (j) $("#ms-jd").value = j.description || ""; };
    $("#ms-go").onclick = function(){

      if (!res.trim()){ toast("Add your résumé in the Profile tab, or paste it here."); return; }
      var r = matchScore(jd, res);
      var color = r.pct >= 70 ? "var(--ok, #4ade80)" : (r.pct >= 45 ? "var(--warn, #fbbf24)" : "var(--danger, #f87171)");
      var chip = function(w, c){ return '<span style="display:inline-block; margin:2px 4px 2px 0; padding:2px 8px; border-radius:999px; border:1px solid '+c+'; font-size:12px;">'+esc(w)+'</span>'; };
      $("#ms-out").innerHTML =
        '<div class="card"><h3>Match: <span style="color:'+color+';">'+r.pct+'%</span> <span class="age">'+r.hit.length+' of the top '+r.count+' job keywords found</span></h3>' +
          '<div style="height:10px; border-radius:6px; background:var(--border); overflow:hidden;"><div style="width:'+r.pct+'%; height:100%; background:'+color+';"></div></div>' +
          '<div class="out-h">Missing from your résumé</div><div>'+(r.miss.length ? r.miss.map(function(w){ return chip(w, "var(--danger, #f87171)"); }).join("") : "Nothing major. Nice.")+'</div>' +
          '<div class="lede" style="margin-top:6px;">Add a missing word only where it’s true for you (a skill you really have, a tool you really used). Don’t stuff keywords.</div>' +
          '<div class="out-h">Already on your résumé</div><div>'+r.hit.map(function(w){ return chip(w, "var(--ok, #4ade80)"); }).join("")+'</div>' +
          '<div class="out-h">Quick checks</div><ul class="apply-steps">'+r.checks.map(function(c){ return '<li>'+(c[0] ? "✓ " : "✗ ")+esc(c[1])+'</li>'; }).join("")+'</ul>' +
          '<div class="lede">Next: use the Tailor button on the job in your Pipeline to have Cindy rewrite your résumé for it.</div></div>';
    };
  }

  // ----- Compare offers (before-tax estimate) -----
  var offers = [{},{},{}];
  var OFFER_FIELDS = [
    ["name","Name (company)","text"],["base","Base salary ($/yr)","number"],["bonus","Bonus or commission ($/yr)","number"],
    ["match","401(k) match (% of salary)","number"],["health","Your health insurance cost ($/yr)","number"],["pto","Paid days off (PTO + holidays)","number"],
    ["remote","Remote days per week","number"],["commute","Commute cost ($/yr)","number"],["hours","Hours per week","number"]
  ];
  function offerCalc(o){
    var base = +o.base || 0, bonus = +o.bonus || 0, match = (+o.match || 0) / 100 * base, health = +o.health || 0, commute = +o.commute || 0;
    var hours = +o.hours || 40, pto = +o.pto || 0;
    var total = base + bonus + match - health - commute;
    var paidHours = Math.max(1, hours * 52 - pto * (hours / 5));
    return { total:total, hourly: base ? base / (hours * 52) : 0, effective: total / Math.max(1, hours * 52), match:match };
  }

        '<div class="stack"><div class="grid2">' +
          '<div><label for="ng-co">Company</label><input id="ng-co" placeholder="Acme Inc."></div>' +

    function draw(){
      var res = offers.map(function(o){ return (o.base || o.bonus) ? offerCalc(o) : null; });
      if (!res.some(Boolean)){ $("#of-out").innerHTML = ""; return; }
      var best = -1, bv = -1; res.forEach(function(r,i){ if (r && r.total > bv){ bv = r.total; best = i; } });
      var money = function(n){ return "$" + Math.round(n).toLocaleString(); };
      var row = function(label, fn){ return '<tr><td style="padding:6px 8px 6px 0; font-size:13px; color:var(--muted);">'+label+'</td>' + res.map(function(r,i){ return '<td style="padding:6px 4px;'+(i===best?' font-weight:700;':'')+'">'+(r ? fn(r) : "—")+'</td>'; }).join("") + '</tr>'; };
      $("#of-out").innerHTML = '<div class="out-h">Estimated yearly value (before tax)</div><div style="overflow-x:auto;"><table style="width:100%; border-collapse:collapse; min-width:560px;"><tbody>' +
        row("Total value", function(r){ return money(r.total); }) +

        '</tbody></table></div>' +
        '<div class="lede" style="margin-top:8px;">Total value = base + bonus + 401(k) match − your insurance cost − commute cost. Highest total is bold. Also weigh growth, stability, culture, remote days and paid time off, which numbers don’t capture.</div>';

    Array.prototype.forEach.call(host.querySelectorAll(".of-in"), function(inp){ inp.oninput = function(){ offers[+inp.dataset.c][inp.dataset.f] = inp.value; draw(); }; });

  // ----- Calendar (.ics files open in Apple, Google and Outlook calendars) -----
  function icsEscape(s){ return String(s || "").split(BS).join(BS+BS).replace(/;/g, BS+";").replace(/,/g, BS+",").replace(/[\r\n]+/g, BS+"n"); }
  function icsStamp(d){ function p(n){ return (n < 10 ? "0" : "") + n; } return d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + "T" + p(d.getHours()) + p(d.getMinutes()) + "00"; }
  function icsDate(d){ function p(n){ return (n < 10 ? "0" : "") + n; } return d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()); }
  function icsEvent(ev){
    var utc = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+Z$/, "Z");
    var L = ["BEGIN:VEVENT", "UID:" + uid() + "@cindy-career-copilot", "DTSTAMP:" + utc];
    if (ev.allDay){ L.push("DTSTART;VALUE=DATE:" + icsDate(ev.start)); var e = new Date(ev.start.getTime() + 86400000); L.push("DTEND;VALUE=DATE:" + icsDate(e)); }
    else { L.push("DTSTART:" + icsStamp(ev.start)); L.push("DTEND:" + icsStamp(new Date(ev.start.getTime() + (ev.minutes || 60) * 60000))); }
    L.push("SUMMARY:" + icsEscape(ev.title));
    if (ev.desc) L.push("DESCRIPTION:" + icsEscape(ev.desc));
    if (ev.location) L.push("LOCATION:" + icsEscape(ev.location));
    if (ev.alarm != null){ L.push("BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + icsEscape(ev.title), "TRIGGER:-PT" + ev.alarm + "M", "END:VALARM"); }
    L.push("END:VEVENT");
    return L;
  }
  function icsFile(events){
    var L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Cindy Career Copilot//EN", "CALSCALE:GREGORIAN"];
    events.forEach(function(ev){ L = L.concat(icsEvent(ev)); });
    L.push("END:VCALENDAR");
    return L.join("\r\n") + "\r\n";
  }

  // ----- My stats (from your Pipeline) -----
  function renderStats(host){
    var jobs = state.jobs, total = jobs.length;
    if (!total){ host.innerHTML = '<div class="card"><h3>My search stats</h3><div class="lede">Save and apply to a few jobs in your Pipeline and your numbers will show up here.</div></div>'; return; }
    var by = {}; STAGES.forEach(function(s){ by[s.key] = 0; }); jobs.forEach(function(j){ if (by[j.status] != null) by[j.status]++; });
    var sent = by.applied + by.interview + by.denied + by.closed;
    var weeks = [], nowMs = Date.now(), wk = 7 * 86400000;
    for (var i = 7; i >= 0; i--) weeks.push({ from: nowMs - (i + 1) * wk, to: nowMs - i * wk, n: 0, label: i === 0 ? "this wk" : i + "w ago" });
    jobs.forEach(function(j){ if (!j.appliedAt) return; var tms = typeof j.appliedAt === "number" ? j.appliedAt : Date.parse(j.appliedAt); weeks.forEach(function(w){ if (tms > w.from && tms <= w.to) w.n++; }); });
    var max = Math.max(1, Math.max.apply(null, weeks.map(function(w){ return w.n; })));
    var bar = function(label, n, m, color){ return '<div style="display:flex; align-items:center; gap:8px; margin:4px 0; font-size:13px;"><span style="width:84px; color:var(--muted);">'+esc(label)+'</span><div style="flex:1; height:14px; background:var(--border); border-radius:4px; overflow:hidden;"><div style="width:'+(n/m*100)+'%; height:100%; background:'+color+';"></div></div><span class="mono" style="width:28px; text-align:right;">'+n+'</span></div>'; };
    var rate = sent ? Math.round(by.interview / sent * 100) : 0;
    host.innerHTML =
      '<div class="card"><h3>My search stats</h3><div class="lede">Built from your Pipeline. '+total+' job'+(total===1?'':'s')+' tracked, '+sent+' applied.</div>' +
        '<div class="out-h">Where your jobs are</div>' + STAGES.map(function(s){ return bar(stageLabel(s.key), by[s.key], Math.max(1,total), "var(--accent)"); }).join("") +
        '<div class="out-h">Applications per week (last 8 weeks)</div>' + weeks.map(function(w){ return bar(w.label, w.n, max, "var(--accent)"); }).join("") +
        '<div class="out-h">Interview rate</div><div class="lede">'+(sent ? rate+'% of your applications are at the interview stage right now ('+by.interview+' of '+sent+').' : 'Apply to a few jobs to see this.')+(sent && sent < 20 ? ' Small numbers swing a lot, so look at the trend after 20 or more applications.' : '')+'</div>' +
        '<div class="lede">If you’re applying a lot and getting few interviews, check the Résumé match score tab and tailor each résumé to its job.</div></div>';
  }

      "Selling at a profit creates a capital gain. If you held the stock for one year or less, it's short-term and taxed as ordinary income at your regular rate. If you held it more than one year, it's long-term and taxed at 0, 15 or 20 percent depending on your income.",
      "For 2026, the 0 percent long-term rate applies to taxable income up to about 49,450 dollars for single filers and 98,900 dollars for married filing jointly; the 20 percent rate starts above about 545,500 dollars single and 613,700 dollars joint. Higher earners may also owe the 3.8 percent net investment income tax. Verify the amounts at irs.gov.",
      "Losses offset gains. If losses exceed gains, you can deduct up to 3,000 dollars a year against other income (1,500 if married filing separately) and carry the rest forward.",
      "Wash sale rule: if you sell at a loss and buy the same or a substantially identical security within 30 days before or after the sale (a 61-day window), the loss is disallowed for now and added to the cost basis of the new shares. It applies across your accounts, including IRAs.",
      "Your broker sends Form 1099-B. You report sales on Form 8949 and Schedule D with your tax return. Dividends are reported on Form 1099-DIV; qualified dividends get lower long-term rates.",
      "Day traders who trade full time may qualify for trader tax status and the mark-to-market election (Section 475(f)), but it must be elected on time and has strict conditions. Talk to a CPA first. Crypto is also reported as property.",
      "Trading income isn't a paycheck: nobody withholds tax. If you owe, you may need quarterly estimated payments (Form 1040-ES). Set money aside as you win."] },
    { t:"9. Tips, tricks and mistakes to avoid", pts:[
      "Paper trade first. Many brokers offer simulators with fake money. Practice your plan for a few weeks to learn the platform and see if your method works.",
      "Start small. Use money you can afford to lose. Your first goal is to not lose big, not to get rich.",
      "Avoid FOMO (fear of missing out). A stock that already jumped 40 percent on social media hype is usually a late entry.",
      "Be careful with earnings announcements, when prices can jump or fall sharply. Watch the calendar.",
      "Trade liquid stocks (high volume, tight spreads). The first and last hour of the day are the most active and most volatile.",
      "Let winners run only according to your plan, and cut losers by your plan. Don't move a stop further away to avoid taking a loss.",
      "Fees to know: commissions are mostly 0 dollars, but there are regulatory fees on sales, margin interest, wire fees and the bid-ask spread.",
      "Turn off the noise: influencers, paid alerts and signal groups often profit from selling subscriptions, not from trading. Check whether a promoter is paid.",
      "Protect your accounts with a unique password and two-factor login, and never give anyone remote access."] },
    { t:"10. Scams and red flags", pts:[

    function calc(){
      var a = parseFloat($("#st-acct").value), r = parseFloat($("#st-risk").value), e = parseFloat($("#st-entry").value), sp = parseFloat($("#st-stop").value), t = parseFloat($("#st-target").value);
      var out = $("#st-out");
      if (!(a > 0 && r > 0 && e > 0 && sp > 0)) { out.textContent = "Fill in the boxes to see the result."; return; }
      var perShare = Math.abs(e - sp);
      if (perShare === 0) { out.textContent = "Entry and stop can't be the same price."; return; }
      var riskUsd = a * r / 100, shares = Math.floor(riskUsd / perShare), cost = shares * e;
      var msg = "Risk limit: $" + riskUsd.toFixed(2) + ". Loss per share if stopped out: $" + perShare.toFixed(2) + ". Position size: " + shares + " share" + (shares === 1 ? "" : "s") + " (about $" + cost.toFixed(2) + ", " + (cost / a * 100).toFixed(0) + "% of the account).";

  async function onSearchMatches(){
    var what = ($("#m-what").value || "").trim();
    var where = ($("#m-where").value || "").trim();
    matchesCache.what = what; matchesCache.where = where; matchesCache.remote = $("#m-remote").checked;
    if (!what){ toast(t("matchesNoQuery")); return; }

    matchesCache.running = true; matchesCache.error = ""; matchesCache.results = null;
    renderMatches($("#tab-body"));
    try {
      var url = AI_BASE + "/api/jobs?what=" + encodeURIComponent(what) + (where && !matchesCache.remote ? "&where=" + encodeURIComponent(where) : "") + (matchesCache.remote ? "&remote=1" : "") +
        (matchesCache.type ? "&type=" + encodeURIComponent(matchesCache.type) : "") +
        (matchesCache.days ? "&days=" + encodeURIComponent(matchesCache.days) : "") +
        (matchesCache.sort ? "&sort=" + encodeURIComponent(matchesCache.sort) : "");
      var res, data;
      if (matchesCache.ats){
        var qs = "what=" + encodeURIComponent(what) + (where && !matchesCache.remote ? "&where=" + encodeURIComponent(where) : "") + (matchesCache.remote ? "&remote=1" : "");
        var parts = await Promise.all([0,1,2,3,4,5].map(function(b){
          return fetch(AI_BASE + "/api/atsjobs?" + qs + "&batch=" + b).then(function(r){ return r.json(); }).catch(function(){ return { results: [] }; });
        }));
        var seenU = {}, merged = [];
        parts.forEach(function(p){ (p.results || []).forEach(function(r){ if (!seenU[r.url]){ seenU[r.url] = 1; merged.push(r); } }); });
        merged.sort(function(a, b2){ return String(b2.created).localeCompare(String(a.created)); });
        res = { ok: true }; data = { results: merged.slice(0, 60) };
      } else {
        res = await fetch(url);
        data = await res.json().catch(function(){ return null; });
      }
      if (!res.ok || !data || data.error){
        matchesCache.error = (data && data.error === "not_configured") ? t("matchesErrorNotConfigured") : t("matchesErrorGeneric");
        matchesCache.results = null;
      } else {
        matchesCache.results = data.results || [];
      }
    } catch(e){
      matchesCache.error = t("matchesErrorGeneric");
    } finally {
      matchesCache.running = false;
      renderMatches($("#tab-body"));
    }
  }

  async function onSavePrepare(idx, btn){

    btn.disabled = true; btn.textContent = "Saving…";

      description:(r.description || "").slice(0, 1500), approved:false,
      status:"saved", tailoredResume:"", coverLetter:"", createdAt:now(), updatedAt:now(), appliedAt:null };
    state.jobs.unshift(job);
    await persistJob(job);
    var direct = autoApplyOk(r.url);
    if (direct){
      job.applyUrl = r.url;

    var linkP = direct ? Promise.resolve({ url: r.url, source: r.source || "the company" })
      : fetch(AI_BASE + "/api/findapply?company=" + encodeURIComponent(r.company) + "&title=" + encodeURIComponent(r.title))

  // ---------- résumé/cover-letter file upload (.txt/.md/.rtf as plain text, .pdf via pdf.js) ----------
  var PDFJS_VERSION = "3.11.174";
  var pdfjsLoadPromise = null;
  function loadPdfJs(){
    if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    if (pdfjsLoadPromise) return pdfjsLoadPromise;
    pdfjsLoadPromise = new Promise(function(resolve, reject){
      var s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/" + PDFJS_VERSION + "/pdf.min.js";
      s.onload = function(){
        try {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/" + PDFJS_VERSION + "/pdf.worker.min.js";
          resolve(window.pdfjsLib);
        } catch(e){ reject(e); }
      };
      s.onerror = function(){ reject(new Error("Couldn’t load the PDF reader — check your connection and try again.")); };
      document.head.appendChild(s);
    });
    return pdfjsLoadPromise;
  }
  async function extractPdfText(file){
    var pdfjsLib = await loadPdfJs();
    var buf = await file.arrayBuffer();
    var doc = await pdfjsLib.getDocument({ data: buf }).promise;
    var pages = [];
    for (var i = 1; i <= doc.numPages; i++){
      var page = await doc.getPage(i);
      var content = await page.getTextContent();
      var lines = [], curLine = [], lastY = null;
      content.items.forEach(function(it){
        var y = it.transform ? it.transform[5] : null;
        if (lastY !== null && y !== null && Math.abs(y - lastY) > 2){
          lines.push(curLine.join(""));
          curLine = [];
        }
        curLine.push(it.str);
        lastY = y;
      });
      if (curLine.length) lines.push(curLine.join(""));
      pages.push(lines.join("\n"));
    }
    return pages.join("\n\n")
      .replace(/[ \t]{2,}/g, " ")
      .replace(/\n{3,}/g, "\n\n")
      .trim();
  }
  function readTextFile(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(String(reader.result||"")); };
      reader.onerror = function(){ reject(new Error("Couldn’t read that file.")); };
      reader.readAsText(file);
    });
  }
  async function extractResumeFile(file){
    var isPdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name || "");
    if (!isPdf) return readTextFile(file);
    var text = await extractPdfText(file);
    if (!text) throw new Error("Couldn’t find any text in that PDF — it may be a scanned image. Paste the text in manually instead.");
    return text;
  }
