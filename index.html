<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Career Copilot</title>
<style>
:root{
  --bg:#faf9f7; --panel:#ffffff; --border:#e4e0da; --text:#2a2620; --muted:#8a8378;
  --accent:#b5793a; --accent-dark:#8f5f2a; --accent-soft:#f3e4d0; --danger:#b5453a;
  --ok:#3a7a4a; --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.04);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1815; --panel:#242019; --border:#3a342c; --text:#efe9df; --muted:#a89e8e;
    --accent:#e0a25f; --accent-dark:#f0b878; --accent-soft:#3a2e1f; --danger:#e08277;
    --ok:#7fcf95; --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 4px 16px rgba(0,0,0,0.25);
  }
}
*{box-sizing:border-box;}
html,body{margin:0; background:var(--bg); color:var(--text);}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
.wrap{max-width:960px; margin:0 auto; padding:28px 20px 80px;}
h1,h2,h3{font-weight:650; letter-spacing:-0.01em;}
h1{font-size:22px; margin:0;}
.sub{color:var(--muted); font-size:13.5px; margin-top:4px;}
.card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px; margin-bottom:18px;}
.row{display:flex; gap:10px; flex-wrap:wrap;}
label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px; font-weight:600; text-transform:uppercase; letter-spacing:.03em;}
input,textarea,select{width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:9px; padding:9px 11px; font-size:14px; font-family:inherit;}
textarea{resize:vertical; min-height:90px; line-height:1.5;}
.field{margin-bottom:14px; flex:1; min-width:180px;}
button{cursor:pointer; border:none; border-radius:9px; padding:10px 16px; font-size:13.5px; font-weight:600; font-family:inherit; transition:transform .08s ease;}
button:active{transform:scale(0.98);}
.btn-primary{background:var(--accent); color:#241b0e;}
.btn-primary:hover{background:var(--accent-dark);}
.btn-ghost{background:transparent; color:var(--text); border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--accent);}
.btn-danger{background:transparent; color:var(--danger); border:1px solid var(--danger);}
button:disabled{opacity:.5; cursor:not-allowed;}
.tabs{display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap;}
.tab{padding:8px 14px; border-radius:999px; font-size:13px; font-weight:600; cursor:pointer; border:1px solid var(--border); background:var(--panel); color:var(--muted);}
.tab.active{background:var(--accent-soft); color:var(--accent-dark); border-color:var(--accent);}
.pill{display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; text-transform:uppercase; letter-spacing:.03em;}
.pill-need{background:#f0d8d5; color:#8a2f22;}
.pill-tailored{background:#dbe8f5; color:#204a75;}
.pill-applied{background:#dcefe0; color:#1f6b34;}
.pill-interview{background:#f5e6c8; color:#7a5817;}
.job{border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:12px; background:var(--bg);}
.job h3{margin:0 0 4px 0; font-size:15.5px;}
.job .meta{color:var(--muted); font-size:12.5px; margin-bottom:8px;}
.muted{color:var(--muted); font-size:13px;}
.note{background:var(--accent-soft); border:1px solid var(--accent); color:var(--accent-dark); border-radius:10px; padding:12px 14px; font-size:13px; margin-bottom:16px; line-height:1.5;}
.notif{display:flex; justify-content:space-between; gap:10px; align-items:flex-start; border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:8px; background:var(--bg);}
.notif.unread{border-color:var(--accent);}
.top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:20px;}
.hide{display:none!important;}
pre.out{white-space:pre-wrap; font-family:inherit; font-size:13.5px; line-height:1.55; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:14px; max-height:420px; overflow:auto;}
.small{font-size:12px; color:var(--muted);}
a{color:var(--accent-dark);}
.avatar{width:34px; height:34px; border-radius:50%; background:var(--accent-soft); color:var(--accent-dark); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px;}
.logoutbtn{font-size:12px; padding:6px 10px;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
// ---- Configuration ----
const SUPABASE_URL = "https://ebtmnbqvjbgrktqcnroj.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_HbeaJ92AN5TYPBQVlCNLDQ_12WnTZ0W";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let session = null, profile = null;
let jobsCache = [], notifsCache = [];
let activeTab = 'profile';

async function init(){
  const { data } = await sb.auth.getSession();
  session = data?.session || null;
  if (session) {
    await loadProfile();
    if (!profile) {
      // Session exists but the account behind it is gone (or has no profile row yet
      // and couldn't be created) — don't render a broken app, start fresh instead.
      await sb.auth.signOut().catch(()=>{});
      session = null;
      renderAuth('Your previous sign-in is no longer valid — please continue below.');
      return;
    }
    renderApp();
  } else {
    renderAuth();
  }
}

async function loadProfile(){
  const { data, error } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  profile = data;
}

function initials(name){
  return (name||'?').trim().split(/\s+/).map(s=>s[0]).slice(0,2).join('').toUpperCase();
}

// ---------- Auth ----------
function renderAuth(msgText){
  app.innerHTML = `
    <div class="top">
      <div>
        <h1>Career Copilot</h1>
        <div class="sub">Your resume, tailored per job — and a bot that keeps the pipeline moving.</div>
      </div>
    </div>
    <div class="card" style="max-width:440px; margin:0 auto;">
      <h3 style="margin-top:0">Get started — takes 30 seconds</h3>
      <div class="small" style="margin-bottom:14px;">Type your name, email, and a password, then tap "Continue." First time, this creates your account automatically.</div>
      <div class="field"><label>Your name</label><input id="a-name" placeholder="Cindy Santos" autocomplete="name"></div>
      <div class="field"><label>Email</label><input id="a-email" type="email" placeholder="you@email.com" autocomplete="email"></div>
      <div class="field"><label>Password (6+ characters)</label><input id="a-pass" type="password" placeholder="••••••••" autocomplete="current-password"></div>
      <button class="btn-primary" style="width:100%" id="a-continue">Continue</button>
      <div class="small" style="margin-top:12px">Your info is private to your account — nobody else using this app can see it.</div>
      <div id="a-msg" class="small" style="color:var(--danger); margin-top:8px;">${esc(msgText||'')}</div>
    </div>
  `;
  $('#a-continue').onclick = onContinue;
  $('#a-pass').addEventListener('keydown', e => { if (e.key === 'Enter') onContinue(); });
}

async function onContinue(){
  const name = $('#a-name').value.trim();
  const email = $('#a-email').value.trim();
  const pass = $('#a-pass').value;
  const msg = $('#a-msg');
  const btn = $('#a-continue');
  if (!email || pass.length < 6){ msg.textContent = 'Enter an email and a password of at least 6 characters.'; return; }
  btn.disabled = true; msg.style.color = 'var(--muted)'; msg.textContent = 'One moment...';
  try {
    const signIn = await sb.auth.signInWithPassword({ email, password: pass });
    if (!signIn.error) {
      session = signIn.data.session;
      await loadProfile();
      if (!profile) {
        await sb.from('profiles').insert({ id: session.user.id, name: name || email, email }).select().maybeSingle();
        await loadProfile();
      }
      renderApp();
      return;
    }
    if (!name) { msg.style.color='var(--danger)'; msg.textContent = 'Enter your name to create a new account (or check your password if you already have one).'; btn.disabled=false; return; }
    const signUp = await sb.auth.signUp({ email, password: pass });
    if (signUp.error) {
      msg.style.color = 'var(--danger)';
      msg.textContent = signUp.error.message || 'Could not create an account with those details.';
      btn.disabled = false;
      return;
    }
    session = signUp.data.session;
    if (!session) {
      msg.style.color = 'var(--danger)';
      msg.textContent = 'Account created — please check your email to confirm, then come back and sign in.';
      btn.disabled = false;
      return;
    }
    await sb.from('profiles').insert({ id: session.user.id, name, email });
    await loadProfile();
    renderApp();
  } catch (e) {
    msg.style.color = 'var(--danger)';
    msg.textContent = 'Something went wrong — please try again.';
    btn.disabled = false;
  }
}

async function logout(){
  await sb.auth.signOut();
  session = null; profile = null;
  renderAuth();
}

// ---------- Shell ----------
function renderApp(){
  app.innerHTML = `
    <div class="top">
      <div style="display:flex; gap:12px; align-items:center;">
        <div class="avatar">${esc(initials(profile?.name))}</div>
        <div>
          <h1>Career Copilot</h1>
          <div class="sub">Signed in as ${esc(profile?.name || session.user.email)}</div>
        </div>
      </div>
      <button class="btn-ghost logoutbtn" id="logout-btn">Sign out</button>
    </div>
    <div class="tabs">
      <div class="tab" data-tab="profile">Profile & Resume</div>
      <div class="tab" data-tab="builder">Resume Builder</div>
      <div class="tab" data-tab="jobs">Job Pipeline</div>
      <div class="tab" data-tab="notifs">Notifications <span id="notif-count"></span></div>
    </div>
    <div id="tab-body"></div>
  `;
  $('#logout-btn').onclick = logout;
  $$('.tab').forEach(t => t.onclick = () => { activeTab = t.dataset.tab; renderTabs(); renderTabBody(); });
  renderTabs();
  renderTabBody();
  refreshNotifCount();
}

function renderTabs(){
  $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === activeTab));
}

async function refreshNotifCount(){
  const { data } = await sb.from('notifications').select('id, read').eq('profile_id', session.user.id);
  notifsCache = data || [];
  const unread = notifsCache.filter(n=>!n.read).length;
  const badge = $('#notif-count');
  if (badge) badge.textContent = unread ? `(${unread})` : '';
}

function renderTabBody(){
  const body = $('#tab-body');
  if (activeTab === 'profile') return renderProfileTab(body);
  if (activeTab === 'builder') return renderBuilderTab(body);
  if (activeTab === 'jobs') return renderJobsTab(body);
  if (activeTab === 'notifs') return renderNotifsTab(body);
}

// ---------- Profile tab ----------
function renderProfileTab(body){
  body.innerHTML = `
    <div class="card">
      <h3 style="margin-top:0">Contact & preferences</h3>
      <div class="row">
        <div class="field"><label>Notification email</label><input id="p-email" value="${esc(profile.email||'')}" placeholder="you@email.com"></div>
        <div class="field"><label>Target roles / keywords</label><input id="p-roles" value="${esc(profile.target_roles||'')}" placeholder="e.g. Customer Success, Healthcare Ops, Remote"></div>
      </div>
      <button class="btn-primary" id="p-save-prefs">Save</button>
      <span id="p-save-msg" class="small" style="margin-left:10px;"></span>
    </div>
    <div class="card">
      <h3 style="margin-top:0">Job platforms & profile links</h3>
      <div class="small" style="margin-bottom:14px;">Keep every place she's findable and applying from in one spot.</div>
      <div class="row">
        <div class="field"><label>LinkedIn profile</label><input id="pl-linkedin" value="${esc(profile.links?.linkedin||'')}" placeholder="https://linkedin.com/in/..."></div>
        <div class="field"><label>Indeed profile</label><input id="pl-indeed" value="${esc(profile.links?.indeed||'')}" placeholder="https://indeed.com/r/..."></div>
      </div>
      <div class="row">
        <div class="field"><label>ZipRecruiter</label><input id="pl-zip" value="${esc(profile.links?.ziprecruiter||'')}" placeholder="https://..."></div>
        <div class="field"><label>Glassdoor</label><input id="pl-glassdoor" value="${esc(profile.links?.glassdoor||'')}" placeholder="https://..."></div>
      </div>
      <div class="row">
        <div class="field"><label>Portfolio / personal website</label><input id="pl-portfolio" value="${esc(profile.links?.portfolio||'')}" placeholder="https://..."></div>
        <div class="field"><label>GitHub (if applicable)</label><input id="pl-github" value="${esc(profile.links?.github||'')}" placeholder="https://github.com/..."></div>
      </div>
      <div class="field"><label>Other links (one per line)</label><textarea id="pl-other" rows="3">${esc(profile.links?.other||'')}</textarea></div>
      <button class="btn-primary" id="pl-save">Save links</button>
      <span id="pl-save-msg" class="small" style="margin-left:10px;"></span>
    </div>
    <div class="card">
      <h3 style="margin-top:0">Resume</h3>
      <div class="small" style="margin-bottom:10px;">Paste your resume text below, or upload a .txt / .md file.</div>
      <input type="file" id="p-file" accept=".txt,.md" style="margin-bottom:10px;">
      <div class="field"><textarea id="p-resume" rows="14" placeholder="Paste your resume text here...">${esc(profile.resume_text||'')}</textarea></div>
      <button class="btn-primary" id="p-save-resume">Save resume</button>
      <span id="p-resume-msg" class="small" style="margin-left:10px;"></span>
    </div>
  `;
  $('#p-save-prefs').onclick = async () => {
    profile.email = $('#p-email').value.trim();
    profile.target_roles = $('#p-roles').value.trim();
    await sb.from('profiles').update({ email: profile.email, target_roles: profile.target_roles }).eq('id', session.user.id);
    flash('#p-save-msg', 'Saved.');
  };
  $('#pl-save').onclick = async () => {
    profile.links = {
      linkedin: $('#pl-linkedin').value.trim(), indeed: $('#pl-indeed').value.trim(),
      ziprecruiter: $('#pl-zip').value.trim(), glassdoor: $('#pl-glassdoor').value.trim(),
      portfolio: $('#pl-portfolio').value.trim(), github: $('#pl-github').value.trim(),
      other: $('#pl-other').value.trim()
    };
    await sb.from('profiles').update({ links: profile.links }).eq('id', session.user.id);
    flash('#pl-save-msg', 'Saved.');
  };
  $('#p-save-resume').onclick = async () => {
    profile.resume_text = $('#p-resume').value;
    await sb.from('profiles').update({ resume_text: profile.resume_text }).eq('id', session.user.id);
    flash('#p-resume-msg', 'Saved.');
  };
  $('#p-file').onchange = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => { $('#p-resume').value = reader.result; };
    reader.readAsText(f);
  };
}

function flash(sel, text){
  const el = $(sel);
  if (!el) return;
  el.textContent = text;
  setTimeout(()=>{ if (el) el.textContent=''; }, 2000);
}

function downloadText(filename, text){
  const blob = new Blob([text], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

async function callAI(mode, payload){
  const { data, error } = await sb.functions.invoke('ai', { body: { mode, ...payload } });
  if (error) throw error;
  return data;
}

// ---------- Builder tab ----------
function renderBuilderTab(body){
  body.innerHTML = `
    <div class="card">
      <h3 style="margin-top:0">Build a resume from scratch</h3>
      <div class="row">
        <div class="field"><label>Full name</label><input id="b-name" value="${esc(profile.name||'')}"></div>
        <div class="field"><label>Location</label><input id="b-loc" placeholder="City, State"></div>
      </div>
      <div class="row">
        <div class="field"><label>Email</label><input id="b-email" value="${esc(profile.email||'')}"></div>
        <div class="field"><label>Phone</label><input id="b-phone"></div>
      </div>
      <div class="field"><label>Professional summary</label><textarea id="b-summary" rows="3"></textarea></div>
      <div class="field"><label>Work experience</label><textarea id="b-exp" rows="8" placeholder="Title, Company (dates)&#10;- bullet"></textarea></div>
      <div class="field"><label>Education</label><textarea id="b-edu" rows="3"></textarea></div>
      <div class="field"><label>Skills (comma separated)</label><textarea id="b-skills" rows="2"></textarea></div>
      <div class="row">
        <button class="btn-primary" id="b-generate">Generate polished resume</button>
        <button class="btn-ghost" id="b-plain">Just format it plainly (no AI)</button>
      </div>
      <div id="b-status" class="small" style="margin-top:8px;"></div>
    </div>
    <div class="card hide" id="b-result-card">
      <h3 style="margin-top:0">Draft resume</h3>
      <pre class="out" id="b-result"></pre>
      <div class="row" style="margin-top:12px;">
        <button class="btn-primary" id="b-use">Set as my active resume</button>
        <button class="btn-ghost" id="b-download">Download as .txt</button>
      </div>
    </div>
  `;
  const gatherFields = () => ({
    name: $('#b-name').value.trim(), loc: $('#b-loc').value.trim(), email: $('#b-email').value.trim(),
    phone: $('#b-phone').value.trim(), summary: $('#b-summary').value.trim(),
    exp: $('#b-exp').value.trim(), edu: $('#b-edu').value.trim(), skills: $('#b-skills').value.trim()
  });
  function plainFormat(f){
    let out = `${f.name}\n${[f.loc,f.email,f.phone].filter(Boolean).join(' | ')}\n\n`;
    if (f.summary) out += `SUMMARY\n${f.summary}\n\n`;
    if (f.exp) out += `EXPERIENCE\n${f.exp}\n\n`;
    if (f.edu) out += `EDUCATION\n${f.edu}\n\n`;
    if (f.skills) out += `SKILLS\n${f.skills}\n`;
    return out.trim();
  }
  $('#b-plain').onclick = () => {
    $('#b-result').textContent = plainFormat(gatherFields());
    $('#b-result-card').classList.remove('hide');
  };
  $('#b-generate').onclick = async () => {
    const status = $('#b-status');
    status.textContent = 'Writing...';
    $('#b-generate').disabled = true;
    try {
      const { text } = await callAI('build', gatherFields());
      $('#b-result').textContent = text;
      $('#b-result-card').classList.remove('hide');
      status.textContent = '';
    } catch(e){
      status.textContent = 'Could not generate right now — try the plain formatter instead.';
    }
    $('#b-generate').disabled = false;
  };
  $('#b-use').onclick = async () => {
    profile.resume_text = $('#b-result').textContent;
    await sb.from('profiles').update({ resume_text: profile.resume_text }).eq('id', session.user.id);
    flash('#b-status', 'Set as your active resume — see the Profile tab.');
  };
  $('#b-download').onclick = () => downloadText((profile.name||'resume').replace(/\s+/g,'_') + '_resume.txt', $('#b-result').textContent);
}

// ---------- Jobs tab ----------
async function loadJobs(){
  const { data } = await sb.from('jobs').select('*').eq('profile_id', session.user.id).order('created_at', { ascending: false });
  jobsCache = data || [];
}

function renderJobsTab(body){
  body.innerHTML = `
    ${!profile.resume_text ? '<div class="note">Add your resume in the Profile tab first so Career Copilot can tailor it to jobs.</div>' : ''}
    <div class="card">
      <h3 style="margin-top:0">Add a job to track</h3>
      <div class="row">
        <div class="field"><label>Job title</label><input id="j-title" placeholder="Customer Success Manager"></div>
        <div class="field"><label>Company</label><input id="j-company" placeholder="Acme Inc."></div>
      </div>
      <div class="field"><label>Job posting URL (optional)</label><input id="j-url" placeholder="https://..."></div>
      <div class="field"><label>Paste the job description</label><textarea id="j-desc" rows="6"></textarea></div>
      <button class="btn-primary" id="j-add">Add to pipeline</button>
    </div>
    <div id="jobs-list">Loading...</div>
  `;
  $('#j-add').onclick = async () => {
    const title = $('#j-title').value.trim(), company = $('#j-company').value.trim();
    const url = $('#j-url').value.trim(), description = $('#j-desc').value.trim();
    if (!title || !company) return;
    await sb.from('jobs').insert({ profile_id: session.user.id, title, company, url, description, status: 'new' });
    await sb.from('notifications').insert({ profile_id: session.user.id, message: `New job added to pipeline: ${title} at ${company}.`, action_needed: false });
    $('#j-title').value=''; $('#j-company').value=''; $('#j-url').value=''; $('#j-desc').value='';
    await loadJobs(); renderJobsList();
  };
  loadJobs().then(renderJobsList);
}

function statusPill(status){
  const map = { new: ['pill-need','New'], tailored: ['pill-tailored','Tailored'], applied: ['pill-applied','Applied'], interview: ['pill-interview','Interview'], closed: ['pill-need','Closed'] };
  const [cls,label] = map[status] || ['pill-need', status];
  return `<span class="pill ${cls}">${esc(label)}</span>`;
}

function renderJobsList(){
  const list = $('#jobs-list');
  if (!list) return;
  if (!jobsCache.length){ list.innerHTML = '<div class="muted">No jobs tracked yet.</div>'; return; }
  list.innerHTML = jobsCache.map(j => `
    <div class="job" data-id="${j.id}">
      <div style="display:flex; justify-content:space-between; align-items:flex-start;">
        <div>
          <h3>${esc(j.title)} — ${esc(j.company)}</h3>
          <div class="meta">${statusPill(j.status)} ${j.url ? `· <a href="${esc(j.url)}" target="_blank" rel="noopener">posting link</a>` : ''}</div>
        </div>
        <button class="btn-danger job-delete" style="padding:6px 10px; font-size:12px;">Remove</button>
      </div>
      <details ${j.tailored_resume ? '' : 'open'}>
        <summary class="small" style="cursor:pointer;">Job description</summary>
        <div class="small" style="white-space:pre-wrap; margin-top:8px;">${esc(j.description || '(none provided)')}</div>
      </details>
      <div class="row" style="margin-top:10px;">
        <button class="btn-primary job-tailor" ${profile.resume_text ? '' : 'disabled'}>Tailor resume & cover letter</button>
        <select class="job-status">
          <option value="new" ${j.status==='new'?'selected':''}>New</option>
          <option value="tailored" ${j.status==='tailored'?'selected':''}>Tailored</option>
          <option value="applied" ${j.status==='applied'?'selected':''}>Applied</option>
          <option value="interview" ${j.status==='interview'?'selected':''}>Interview</option>
          <option value="closed" ${j.status==='closed'?'selected':''}>Closed</option>
        </select>
      </div>
      ${j.tailored_resume ? `
      <div style="margin-top:12px;">
        <div class="small" style="font-weight:700; margin-bottom:4px;">Tailored resume</div>
        <pre class="out">${esc(j.tailored_resume)}</pre>
        <button class="btn-ghost job-dl-resume" style="margin-top:6px;">Download resume</button>
      </div>` : ''}
      ${j.cover_letter ? `
      <div style="margin-top:12px;">
        <div class="small" style="font-weight:700; margin-bottom:4px;">Cover letter draft</div>
        <pre class="out">${esc(j.cover_letter)}</pre>
        <button class="btn-ghost job-dl-cover" style="margin-top:6px;">Download cover letter</button>
      </div>` : ''}
    </div>
  `).join('');

  $$('.job-delete', list).forEach(btn => btn.onclick = async (e) => {
    const id = e.target.closest('.job').dataset.id;
    await sb.from('jobs').delete().eq('id', id);
    await loadJobs(); renderJobsList();
  });
  $$('.job-status', list).forEach(sel => sel.onchange = async (e) => {
    const id = e.target.closest('.job').dataset.id;
    const status = e.target.value;
    await sb.from('jobs').update({ status }).eq('id', id);
    if (status === 'applied') await sb.from('notifications').insert({ profile_id: session.user.id, message: 'Marked applied: check the job\'s posting portal in case it needs a follow-up step from you.', action_needed: false });
    if (status === 'interview') await sb.from('notifications').insert({ profile_id: session.user.id, message: 'Interview stage reached for a tracked job — time to prep!', action_needed: true });
    await loadJobs(); renderJobsList(); refreshNotifCount();
  });
  $$('.job-tailor', list).forEach(btn => btn.onclick = async (e) => {
    const id = e.target.closest('.job').dataset.id;
    const job = jobsCache.find(j=>j.id===id);
    btn.disabled = true; btn.textContent = 'Tailoring...';
    try {
      const result = await callAI('tailor', { resume: profile.resume_text, title: job.title, company: job.company, description: job.description });
      await sb.from('jobs').update({ tailored_resume: result.resume, cover_letter: result.coverLetter, status: 'tailored' }).eq('id', id);
      await sb.from('notifications').insert({ profile_id: session.user.id, message: `Tailored resume + cover letter ready for ${job.title} at ${job.company}. Review before applying.`, action_needed: true });
      await loadJobs(); renderJobsList(); refreshNotifCount();
    } catch(err){
      alert('Could not tailor right now — the AI service may not be configured yet.');
      btn.disabled = false; btn.textContent = 'Tailor resume & cover letter';
    }
  });
  $$('.job-dl-resume', list).forEach(btn => btn.onclick = (e) => {
    const job = jobsCache.find(j=>j.id===e.target.closest('.job').dataset.id);
    downloadText(`${job.company}_${job.title}_resume.txt`.replace(/\s+/g,'_'), job.tailored_resume);
  });
  $$('.job-dl-cover', list).forEach(btn => btn.onclick = (e) => {
    const job = jobsCache.find(j=>j.id===e.target.closest('.job').dataset.id);
    downloadText(`${job.company}_${job.title}_cover_letter.txt`.replace(/\s+/g,'_'), job.cover_letter);
  });
}

// ---------- Notifications ----------
async function loadNotifs(){
  const { data } = await sb.from('notifications').select('*').eq('profile_id', session.user.id).order('created_at', { ascending: false });
  notifsCache = data || [];
}

function renderNotifsTab(body){
  loadNotifs().then(() => {
    if (!notifsCache.length){
      body.innerHTML = '<div class="card muted">No notifications yet.</div>';
      return;
    }
    body.innerHTML = `
      <div class="card">
        ${notifsCache.map(n => `
          <div class="notif ${n.read?'':'unread'}" data-id="${n.id}">
            <div>
              ${n.action_needed ? '<span class="pill pill-need">Action needed</span> ' : ''}
              <div style="margin-top:6px;">${esc(n.message)}</div>
              <div class="small" style="margin-top:4px;">${new Date(n.created_at).toLocaleString()}</div>
            </div>
            ${!n.read ? '<button class="btn-ghost notif-read" style="padding:6px 10px; font-size:12px; white-space:nowrap;">Mark read</button>' : ''}
          </div>
        `).join('')}
      </div>
    `;
    $$('.notif-read', body).forEach(btn => btn.onclick = async (e) => {
      const id = e.target.closest('.notif').dataset.id;
      await sb.from('notifications').update({ read: true }).eq('id', id);
      await loadNotifs(); renderNotifsTab(body); refreshNotifCount();
    });
  });
}

init();
</script>
</body>
</html>
