<title>Career Copilot</title>
<style>
:root{
  --bg:#faf9f7; --panel:#ffffff; --border:#e4e0da; --text:#2a2620; --muted:#8a8378;
  --accent:#b5793a; --accent-dark:#8f5f2a; --accent-soft:#f3e4d0; --danger:#b5453a;
  --ok:#3a7a4a; --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.04);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1815; --panel:#242019; --border:#3a342c; --text:#efe9df; --muted:#a89e8e;
    --accent:#e0a25f; --accent-dark:#f0b878; --accent-soft:#3a2e1f; --danger:#e08277;
    --ok:#7fcf95; --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 4px 16px rgba(0,0,0,0.25);
  }
}
:root[data-theme="dark"]{
  --bg:#1b1815; --panel:#242019; --border:#3a342c; --text:#efe9df; --muted:#a89e8e;
  --accent:#e0a25f; --accent-dark:#f0b878; --accent-soft:#3a2e1f; --danger:#e08277;
  --ok:#7fcf95; --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 4px 16px rgba(0,0,0,0.25);
}
*{box-sizing:border-box;}
body{background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; margin:0;}
.wrap{max-width:960px; margin:0 auto; padding:28px 20px 80px;}
h1,h2,h3{font-weight:650; letter-spacing:-0.01em;}
h1{font-size:22px; margin:0;}
.sub{color:var(--muted); font-size:13.5px; margin-top:4px;}
.card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px; margin-bottom:18px;}
.row{display:flex; gap:10px; flex-wrap:wrap;}
label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px; font-weight:600; text-transform:uppercase; letter-spacing:.03em;}
input,textarea,select{width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:9px; padding:9px 11px; font-size:14px; font-family:inherit;}
textarea{resize:vertical; min-height:90px; line-height:1.5;}
.field{margin-bottom:14px; flex:1; min-width:180px;}
button{cursor:pointer; border:none; border-radius:9px; padding:10px 16px; font-size:13.5px; font-weight:600; font-family:inherit; transition:transform .08s ease;}
button:active{transform:scale(0.98);}
.btn-primary{background:var(--accent); color:#241b0e;}
.btn-primary:hover{background:var(--accent-dark);}
.btn-ghost{background:transparent; color:var(--text); border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--accent);}
.btn-danger{background:transparent; color:var(--danger); border:1px solid var(--danger);}
button:disabled{opacity:.5; cursor:not-allowed;}
.tabs{display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap;}
.tab{padding:8px 14px; border-radius:999px; font-size:13px; font-weight:600; cursor:pointer; border:1px solid var(--border); background:var(--panel); color:var(--muted);}
.tab.active{background:var(--accent-soft); color:var(--accent-dark); border-color:var(--accent);}
.pill{display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; text-transform:uppercase; letter-spacing:.03em;}
.pill-need{background:#f0d8d5; color:#8a2f22;}
.pill-tailored{background:#dbe8f5; color:#204a75;}
.pill-applied{background:#dcefe0; color:#1f6b34;}
.pill-interview{background:#f5e6c8; color:#7a5817;}
:root[data-theme="dark"] .pill-need, :root:not([data-theme="light"]) .pill-need{background:#4a2622; color:#f0b8ae;}
:root[data-theme="dark"] .pill-tailored, :root:not([data-theme="light"]) .pill-tailored{background:#1f3348; color:#aecbea;}
:root[data-theme="dark"] .pill-applied, :root:not([data-theme="light"]) .pill-applied{background:#1c3a26; color:#a9dcb8;}
:root[data-theme="dark"] .pill-interview, :root:not([data-theme="light"]) .pill-interview{background:#4a3a1a; color:#f0d193;}
.job{border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:12px; background:var(--bg);}
.job h3{margin:0 0 4px 0; font-size:15.5px;}
.job .meta{color:var(--muted); font-size:12.5px; margin-bottom:8px;}
.muted{color:var(--muted); font-size:13px;}
.note{background:var(--accent-soft); border:1px solid var(--accent); color:var(--accent-dark); border-radius:10px; padding:12px 14px; font-size:13px; margin-bottom:16px; line-height:1.5;}
.notif{display:flex; justify-content:space-between; gap:10px; align-items:flex-start; border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:8px; background:var(--bg);}
.notif.unread{border-color:var(--accent);}
.top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:20px;}
.hide{display:none!important;}
pre.out{white-space:pre-wrap; font-family:inherit; font-size:13.5px; line-height:1.55; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:14px; max-height:420px; overflow:auto;}
.small{font-size:12px; color:var(--muted);}
a{color:var(--accent-dark);}
.avatar{width:34px; height:34px; border-radius:50%; background:var(--accent-soft); color:var(--accent-dark); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px;}
.logoutbtn{font-size:12px; padding:6px 10px;}
</style>

<div class="wrap" id="app"></div>

<script>
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const app = $('#app');
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let db = null, sample = null, downloads = null;
let profileId = null, profile = null;
let unsubJobs = null, unsubNotifs = null;
let jobsCache = [], notifsCache = [];
let activeTab = 'profile';

function simpleHash(str){
  let h = 0;
  for (let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
  return h.toString(36);
}

async function init(){
  try { db = await claude.use('db'); } catch(e){ db = null; }
  try { sample = await claude.use('sample'); } catch(e){ sample = null; }
  try { downloads = await claude.use('downloads'); } catch(e){ downloads = null; }

  const saved = safeGet('careercopilot_profile_id');
  if (saved && db){
    const doc = await db.doc('profiles/' + saved).get().catch(()=>null);
    if (doc && doc.exists !== false && doc.data){
      profileId = saved; profile = doc.data();
      renderApp();
      return;
    }
  }
  renderAuth();
}

function safeGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function safeSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
function safeRemove(k){ try { localStorage.removeItem(k); } catch(e){} }

function renderAuth(){
  app.innerHTML = `
    <div class="top">
      <div>
        <h1>Career Copilot</h1>
        <div class="sub">Your resume, tailored per job — and a bot that keeps the pipeline moving.</div>
      </div>
    </div>
    ${!db ? `<div class="note">This page can't reach its data store right now, so profiles can't be saved in this view. You can still explore, but nothing will persist.</div>` : ''}
    <div class="card" style="max-width:440px; margin:0 auto;">
      <h3 style="margin-top:0">Get started — takes 30 seconds</h3>
      <div class="small" style="margin-bottom:14px;">Type your name and make up a simple PIN (like a 4-digit code), then tap "Continue." First time, this sets you up automatically. This browser will remember you, so you won't need to do this again unless you switch devices.</div>
      <div class="field"><label>Your name</label><input id="a-name" placeholder="Cindy Santos" autocomplete="name"></div>
      <div class="field"><label>Make up a PIN (4+ characters, easy to remember)</label><input id="a-pin" type="password" placeholder="e.g. 1234" autocomplete="off" inputmode="numeric"></div>
      <button class="btn-primary" style="width:100%" id="a-continue">Continue</button>
      <div class="small" style="margin-top:12px">Note: this PIN just keeps your info separate from anyone else using this app — it's not bank-level security, so please don't add sensitive info like SSNs or financial details.</div>
      <div id="a-msg" class="small" style="color:var(--danger); margin-top:8px;"></div>
    </div>
  `;
  $('#a-continue').onclick = onContinue;
  $('#a-pin').addEventListener('keydown', e => { if (e.key === 'Enter') onContinue(); });
  $('#a-name').addEventListener('keydown', e => { if (e.key === 'Enter') $('#a-pin').focus(); });
}

// Single "Continue" flow: if this name+PIN already exists, log in; if the name
// exists with a different PIN, say so; otherwise create a fresh profile.
// This avoids making a non-technical user choose between two buttons.
async function onContinue(){
  const name = $('#a-name').value.trim();
  const pin = $('#a-pin').value.trim();
  const msg = $('#a-msg');
  const btn = $('#a-continue');
  if (!name || pin.length < 4){ msg.textContent = 'Enter your name and a PIN of at least 4 characters.'; return; }
  if (!db){ msg.textContent = 'Data store unavailable right now — try again shortly.'; return; }
  btn.disabled = true; msg.style.color = 'var(--muted)'; msg.textContent = 'One moment...';
  try {
    const norm = s => String(s||'').trim().toLowerCase();
    const wantPin = simpleHash(pin);
    const res = await db.collection('profiles').get().catch(()=>null);
    const docs = res?.docs || res || [];
    const sameName = docs.find(d => norm((d.data ? d.data() : d).name) === norm(name));
    if (sameName) {
      const data = sameName.data ? sameName.data() : sameName;
      if (data.pinHash === wantPin) {
        profileId = sameName.id; profile = data;
        safeSet('careercopilot_profile_id', profileId);
        renderApp();
        return;
      } else {
        msg.style.color = 'var(--danger)';
        msg.textContent = "That PIN doesn't match the profile already saved under that name. Double-check your PIN, or use a slightly different name (e.g. add a middle initial) to start a new profile.";
        btn.disabled = false;
        return;
      }
    }
    // No profile under this name yet — create one.
    const id = uid();
    const data = { name, pinHash: wantPin, email: '', targetRoles: '', resumeText: '', createdAt: Date.now(), plan: 'personal' };
    await db.doc('profiles/' + id).set(data);
    profileId = id; profile = data;
    safeSet('careercopilot_profile_id', id);
    renderApp();
  } catch (e) {
    msg.style.color = 'var(--danger)';
    msg.textContent = 'Something went wrong — please try again.';
    btn.disabled = false;
  }
}

function logout(){
  safeRemove('careercopilot_profile_id');
  if (unsubJobs) { try{unsubJobs();}catch(e){} unsubJobs=null; }
  if (unsubNotifs) { try{unsubNotifs();}catch(e){} unsubNotifs=null; }
  profileId = null; profile = null;
  renderAuth();
}

function initials(name){
  return (name||'?').trim().split(/\s+/).map(s=>s[0]).slice(0,2).join('').toUpperCase();
}

function renderApp(){
  app.innerHTML = `
    <div class="top">
      <div style="display:flex; gap:12px; align-items:center;">
        <div class="avatar">${esc(initials(profile.name))}</div>
        <div>
          <h1>Career Copilot</h1>
          <div class="sub">Signed in as ${esc(profile.name)}</div>
        </div>
      </div>
      <button class="btn-ghost logoutbtn" id="logout-btn">Switch profile</button>
    </div>
    <div class="tabs">
      <div class="tab" data-tab="profile">Profile & Resume</div>
      <div class="tab" data-tab="builder">Resume Builder</div>
      <div class="tab" data-tab="jobs">Job Pipeline</div>
      <div class="tab" data-tab="notifs">Notifications <span id="notif-count"></span></div>
    </div>
    <div id="tab-body"></div>
  `;
  $('#logout-btn').onclick = logout;
  $$('.tab').forEach(t => t.onclick = () => { activeTab = t.dataset.tab; renderTabs(); renderTabBody(); });
  subscribe();
  renderTabs();
  renderTabBody();
}

function renderTabs(){
  $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === activeTab));
}

function subscribe(){
  if (!db) return;
  if (!unsubJobs){
    unsubJobs = db.collection('profiles/' + profileId + '/jobs').onSnapshot(snap => {
      const docs = snap.docs || snap || [];
      jobsCache = docs.map(d => ({ id: d.id, ...(d.data ? d.data() : d) })).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
      if (activeTab === 'jobs') renderTabBody();
    });
  }
  if (!unsubNotifs){
    unsubNotifs = db.collection('profiles/' + profileId + '/notifications').onSnapshot(snap => {
      const docs = snap.docs || snap || [];
      notifsCache = docs.map(d => ({ id: d.id, ...(d.data ? d.data() : d) })).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
      const unread = notifsCache.filter(n=>!n.read).length;
      const badge = $('#notif-count');
      if (badge) badge.textContent = unread ? `(${unread})` : '';
      if (activeTab === 'notifs') renderTabBody();
    });
  }
}

function renderTabBody(){
  const body = $('#tab-body');
  if (activeTab === 'profile') return renderProfileTab(body);
  if (activeTab === 'builder') return renderBuilderTab(body);
  if (activeTab === 'jobs') return renderJobsTab(body);
  if (activeTab === 'notifs') return renderNotifsTab(body);
}

// ---------- Profile tab ----------
function renderProfileTab(body){
  body.innerHTML = `
    <div class="card">
      <h3 style="margin-top:0">Contact & preferences</h3>
      <div class="row">
        <div class="field"><label>Notification email</label><input id="p-email" value="${esc(profile.email||'')}" placeholder="you@email.com"></div>
        <div class="field"><label>Target roles / keywords</label><input id="p-roles" value="${esc(profile.targetRoles||'')}" placeholder="e.g. Customer Success, Healthcare Ops, Remote"></div>
      </div>
      <button class="btn-primary" id="p-save-prefs">Save</button>
      <span id="p-save-msg" class="small" style="margin-left:10px;"></span>
    </div>
    <div class="card">
      <h3 style="margin-top:0">Job platforms & profile links</h3>
      <div class="small" style="margin-bottom:14px;">Keep every place she's findable and applying from in one spot. These are reference links only — Career Copilot doesn't sign into these sites for her.</div>
      <div class="row">
        <div class="field"><label>LinkedIn profile</label><input id="pl-linkedin" value="${esc(profile.links?.linkedin||'')}" placeholder="https://linkedin.com/in/..."></div>
        <div class="field"><label>Indeed profile</label><input id="pl-indeed" value="${esc(profile.links?.indeed||'')}" placeholder="https://indeed.com/r/..."></div>
      </div>
      <div class="row">
        <div class="field"><label>ZipRecruiter</label><input id="pl-zip" value="${esc(profile.links?.ziprecruiter||'')}" placeholder="https://..."></div>
        <div class="field"><label>Glassdoor</label><input id="pl-glassdoor" value="${esc(profile.links?.glassdoor||'')}" placeholder="https://..."></div>
      </div>
      <div class="row">
        <div class="field"><label>Portfolio / personal website</label><input id="pl-portfolio" value="${esc(profile.links?.portfolio||'')}" placeholder="https://..."></div>
        <div class="field"><label>GitHub (if applicable)</label><input id="pl-github" value="${esc(profile.links?.github||'')}" placeholder="https://github.com/..."></div>
      </div>
      <div class="field"><label>Other links (one per line — Wellfound, Dice, a staffing agency portal, etc.)</label><textarea id="pl-other" rows="3" placeholder="https://...">${esc(profile.links?.other||'')}</textarea></div>
      <button class="btn-primary" id="pl-save">Save links</button>
      <span id="pl-save-msg" class="small" style="margin-left:10px;"></span>
    </div>
    <div class="card">
      <h3 style="margin-top:0">Resume</h3>
      <div class="small" style="margin-bottom:10px;">Paste your resume text below, or upload a .txt / .md file. (PDF/Word: open it and copy-paste the text in — the built-in Resume Builder tab can also generate one from scratch.)</div>
      <input type="file" id="p-file" accept=".txt,.md" style="margin-bottom:10px;">
      <div class="field"><textarea id="p-resume" rows="14" placeholder="Paste your resume text here...">${esc(profile.resumeText||'')}</textarea></div>
      <button class="btn-primary" id="p-save-resume">Save resume</button>
      <span id="p-resume-msg" class="small" style="margin-left:10px;"></span>
    </div>
  `;
  $('#p-save-prefs').onclick = async () => {
    profile.email = $('#p-email').value.trim();
    profile.targetRoles = $('#p-roles').value.trim();
    await db.doc('profiles/'+profileId).update({ email: profile.email, targetRoles: profile.targetRoles });
    $('#p-save-msg').textContent = 'Saved.';
    setTimeout(()=>{ const m=$('#p-save-msg'); if(m) m.textContent=''; }, 2000);
  };
  $('#pl-save').onclick = async () => {
    profile.links = {
      linkedin: $('#pl-linkedin').value.trim(), indeed: $('#pl-indeed').value.trim(),
      ziprecruiter: $('#pl-zip').value.trim(), glassdoor: $('#pl-glassdoor').value.trim(),
      portfolio: $('#pl-portfolio').value.trim(), github: $('#pl-github').value.trim(),
      other: $('#pl-other').value.trim()
    };
    await db.doc('profiles/'+profileId).update({ links: profile.links });
    $('#pl-save-msg').textContent = 'Saved.';
    setTimeout(()=>{ const m=$('#pl-save-msg'); if(m) m.textContent=''; }, 2000);
  };
  $('#p-save-resume').onclick = async () => {
    profile.resumeText = $('#p-resume').value;
    await db.doc('profiles/'+profileId).update({ resumeText: profile.resumeText });
    $('#p-resume-msg').textContent = 'Saved.';
    setTimeout(()=>{ const m=$('#p-resume-msg'); if(m) m.textContent=''; }, 2000);
  };
  $('#p-file').onchange = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => { $('#p-resume').value = reader.result; };
    reader.readAsText(f);
  };
}

// ---------- Builder tab ----------
function renderBuilderTab(body){
  body.innerHTML = `
    <div class="card">
      <h3 style="margin-top:0">Build a resume from scratch</h3>
      <div class="small" style="margin-bottom:14px;">Fill in what applies — Career Copilot will format it into clean resume text you can save as your active resume or download.</div>
      <div class="row">
        <div class="field"><label>Full name</label><input id="b-name" value="${esc(profile.name||'')}"></div>
        <div class="field"><label>Location</label><input id="b-loc" placeholder="City, State"></div>
      </div>
      <div class="row">
        <div class="field"><label>Email</label><input id="b-email" value="${esc(profile.email||'')}"></div>
        <div class="field"><label>Phone</label><input id="b-phone"></div>
      </div>
      <div class="field"><label>Professional summary (2-3 sentences)</label><textarea id="b-summary" rows="3"></textarea></div>
      <div class="field"><label>Work experience (one role per line or block — include title, company, dates, bullets)</label><textarea id="b-exp" rows="8" placeholder="Customer Success Manager, Acme Co (2021-2024)&#10;- Did X resulting in Y&#10;- Did Z"></textarea></div>
      <div class="field"><label>Education</label><textarea id="b-edu" rows="3"></textarea></div>
      <div class="field"><label>Skills (comma separated)</label><textarea id="b-skills" rows="2"></textarea></div>
      <div class="row">
        <button class="btn-primary" id="b-generate" ${sample?'':'disabled'}>Generate polished resume</button>
        <button class="btn-ghost" id="b-plain">Just format it plainly (no AI)</button>
      </div>
      ${sample ? '' : '<div class="small" style="margin-top:8px;">AI polishing isn\'t available in this view — plain formatting still works.</div>'}
      <div id="b-status" class="small" style="margin-top:8px;"></div>
    </div>
    <div class="card hide" id="b-result-card">
      <h3 style="margin-top:0">Draft resume</h3>
      <pre class="out" id="b-result"></pre>
      <div class="row" style="margin-top:12px;">
        <button class="btn-primary" id="b-use">Set as my active resume</button>
        <button class="btn-ghost" id="b-download" ${downloads?'':'disabled'}>Download as .txt</button>
      </div>
    </div>
  `;
  const gatherFields = () => ({
    name: $('#b-name').value.trim(), loc: $('#b-loc').value.trim(), email: $('#b-email').value.trim(),
    phone: $('#b-phone').value.trim(), summary: $('#b-summary').value.trim(),
    exp: $('#b-exp').value.trim(), edu: $('#b-edu').value.trim(), skills: $('#b-skills').value.trim()
  });

  function plainFormat(f){
    let out = `${f.name}\n${[f.loc,f.email,f.phone].filter(Boolean).join(' | ')}\n\n`;
    if (f.summary) out += `SUMMARY\n${f.summary}\n\n`;
    if (f.exp) out += `EXPERIENCE\n${f.exp}\n\n`;
    if (f.edu) out += `EDUCATION\n${f.edu}\n\n`;
    if (f.skills) out += `SKILLS\n${f.skills}\n`;
    return out.trim();
  }

  $('#b-plain').onclick = () => {
    const text = plainFormat(gatherFields());
    $('#b-result').textContent = text;
    $('#b-result-card').classList.remove('hide');
  };

  $('#b-generate').onclick = async () => {
    if (!sample) return;
    const f = gatherFields();
    const status = $('#b-status');
    status.textContent = 'Writing...';
    $('#b-generate').disabled = true;
    try {
      const prompt = `Format the following into a clean, ATS-friendly plain-text resume. Use clear section headers (SUMMARY, EXPERIENCE, EDUCATION, SKILLS), keep bullet points concise and achievement-oriented, fix grammar, but do not invent any facts, employers, dates, or numbers that are not given below. Output only the finished resume text, no commentary.\n\nName: ${f.name}\nLocation: ${f.loc}\nEmail: ${f.email}\nPhone: ${f.phone}\nSummary notes: ${f.summary}\nExperience notes:\n${f.exp}\nEducation: ${f.edu}\nSkills: ${f.skills}`;
      const { text } = await sample(prompt, { modelTier: 'default' });
      $('#b-result').textContent = text;
      $('#b-result-card').classList.remove('hide');
      status.textContent = '';
    } catch(e){
      status.textContent = e.code === 'not_granted' ? 'AI access was declined for this view.' : 'Could not generate right now — try the plain formatter instead.';
    }
    $('#b-generate').disabled = false;
  };

  $('#b-use').onclick = async () => {
    profile.resumeText = $('#b-result').textContent;
    await db.doc('profiles/'+profileId).update({ resumeText: profile.resumeText });
    $('#b-status').textContent = 'Set as your active resume — see the Profile tab.';
  };
  $('#b-download').onclick = async () => {
    if (!downloads) return;
    try {
      await downloads.save({ filename: (profile.name||'resume').replace(/\s+/g,'_') + '_resume.txt', data: $('#b-result').textContent });
    } catch(e){}
  };
}

// ---------- Jobs tab ----------
function renderJobsTab(body){
  body.innerHTML = `
    ${!profile.resumeText ? '<div class="note">Add your resume in the Profile tab first so Career Copilot can tailor it to jobs.</div>' : ''}
    <div class="card">
      <h3 style="margin-top:0">Add a job to track</h3>
      <div class="row">
        <div class="field"><label>Job title</label><input id="j-title" placeholder="Customer Success Manager"></div>
        <div class="field"><label>Company</label><input id="j-company" placeholder="Acme Inc."></div>
      </div>
      <div class="field"><label>Job posting URL (optional)</label><input id="j-url" placeholder="https://..."></div>
      <div class="field"><label>Paste the job description</label><textarea id="j-desc" rows="6" placeholder="Paste the full job posting text here"></textarea></div>
      <button class="btn-primary" id="j-add">Add to pipeline</button>
    </div>
    <div id="jobs-list"></div>
  `;
  $('#j-add').onclick = async () => {
    const title = $('#j-title').value.trim(), company = $('#j-company').value.trim();
    const url = $('#j-url').value.trim(), description = $('#j-desc').value.trim();
    if (!title || !company){ return; }
    const id = uid();
    await db.doc('profiles/'+profileId+'/jobs/'+id).set({
      title, company, url, description, status: 'new', tailoredResume: '', coverLetter: '', createdAt: Date.now()
    });
    await addNotification(`New job added to pipeline: ${title} at ${company}. Review and tailor your resume when ready.`, false);
    $('#j-title').value=''; $('#j-company').value=''; $('#j-url').value=''; $('#j-desc').value='';
  };
  renderJobsList();
}

function statusPill(status){
  const map = { new: ['pill-need','New'], tailored: ['pill-tailored','Tailored'], applied: ['pill-applied','Applied'], interview: ['pill-interview','Interview'], closed: ['pill-need','Closed'] };
  const [cls,label] = map[status] || ['pill-need', status];
  return `<span class="pill ${cls}">${esc(label)}</span>`;
}

function renderJobsList(){
  const list = $('#jobs-list');
  if (!list) return;
  if (!jobsCache.length){ list.innerHTML = '<div class="muted">No jobs tracked yet.</div>'; return; }
  list.innerHTML = jobsCache.map(j => `
    <div class="job" data-id="${j.id}">
      <div style="display:flex; justify-content:space-between; align-items:flex-start;">
        <div>
          <h3>${esc(j.title)} — ${esc(j.company)}</h3>
          <div class="meta">${statusPill(j.status)} ${j.url ? `· <a href="${esc(j.url)}" target="_blank" rel="noopener">posting link</a>` : ''}</div>
        </div>
        <button class="btn-danger job-delete" style="padding:6px 10px; font-size:12px;">Remove</button>
      </div>
      <details ${j.tailoredResume ? '' : 'open'}>
        <summary class="small" style="cursor:pointer;">Job description</summary>
        <div class="small" style="white-space:pre-wrap; margin-top:8px;">${esc(j.description || '(none provided)')}</div>
      </details>
      <div class="row" style="margin-top:10px;">
        <button class="btn-primary job-tailor" ${sample && profile.resumeText ? '' : 'disabled'}>Tailor resume & cover letter</button>
        <select class="job-status">
          <option value="new" ${j.status==='new'?'selected':''}>New</option>
          <option value="tailored" ${j.status==='tailored'?'selected':''}>Tailored</option>
          <option value="applied" ${j.status==='applied'?'selected':''}>Applied</option>
          <option value="interview" ${j.status==='interview'?'selected':''}>Interview</option>
          <option value="closed" ${j.status==='closed'?'selected':''}>Closed</option>
        </select>
      </div>
      ${j.tailoredResume ? `
      <div style="margin-top:12px;">
        <div class="small" style="font-weight:700; margin-bottom:4px;">Tailored resume</div>
        <pre class="out">${esc(j.tailoredResume)}</pre>
        <button class="btn-ghost job-dl-resume" style="margin-top:6px;" ${downloads?'':'disabled'}>Download resume</button>
      </div>` : ''}
      ${j.coverLetter ? `
      <div style="margin-top:12px;">
        <div class="small" style="font-weight:700; margin-bottom:4px;">Cover letter draft</div>
        <pre class="out">${esc(j.coverLetter)}</pre>
        <button class="btn-ghost job-dl-cover" style="margin-top:6px;" ${downloads?'':'disabled'}>Download cover letter</button>
      </div>` : ''}
    </div>
  `).join('');

  $$('.job-delete', list).forEach(btn => btn.onclick = async (e) => {
    const id = e.target.closest('.job').dataset.id;
    await db.doc('profiles/'+profileId+'/jobs/'+id).delete();
  });
  $$('.job-status', list).forEach(sel => sel.onchange = async (e) => {
    const id = e.target.closest('.job').dataset.id;
    const status = e.target.value;
    await db.doc('profiles/'+profileId+'/jobs/'+id).update({ status });
    if (status === 'applied') await addNotification(`Marked applied: check the job's posting portal in case it needs a follow-up step from you.`, false);
    if (status === 'interview') await addNotification(`Interview stage reached for a tracked job — time to prep!`, true);
  });
  $$('.job-tailor', list).forEach(btn => btn.onclick = async (e) => {
    const jobEl = e.target.closest('.job');
    const id = jobEl.dataset.id;
    const job = jobsCache.find(j=>j.id===id);
    btn.disabled = true; btn.textContent = 'Tailoring...';
    try {
      const prompt = `You are helping a job seeker tailor their materials for one specific job. Do not invent employers, dates, degrees, or facts not present in the resume below.\n\nRESUME:\n${profile.resumeText.slice(0,6000)}\n\nJOB TITLE: ${job.title}\nCOMPANY: ${job.company}\nJOB DESCRIPTION:\n${(job.description||'').slice(0,6000)}\n\nReply with exactly two sections, in plain text, separated by the line "=====":\n1. A tailored version of the resume (reordered/reworded to emphasize the most relevant experience and skills for this job, same facts only).\n2. A concise 3-paragraph cover letter for this specific role.`;
      const { text } = await sample(prompt, { modelTier: 'default' });
      const [resumePart, coverPart] = text.split('=====');
      await db.doc('profiles/'+profileId+'/jobs/'+id).update({
        tailoredResume: (resumePart||'').trim(), coverLetter: (coverPart||'').trim(), status: 'tailored'
      });
      await addNotification(`Tailored resume + cover letter ready for ${job.title} at ${job.company}. Review before applying.`, true);
    } catch(err){
      alert('Could not tailor right now: ' + (err.code || 'unknown error'));
    }
    btn.disabled = false; btn.textContent = 'Tailor resume & cover letter';
  });
  $$('.job-dl-resume', list).forEach(btn => btn.onclick = async (e) => {
    const job = jobsCache.find(j=>j.id===e.target.closest('.job').dataset.id);
    await downloads.save({ filename: `${job.company}_${job.title}_resume.txt`.replace(/\s+/g,'_'), data: job.tailoredResume }).catch(()=>{});
  });
  $$('.job-dl-cover', list).forEach(btn => btn.onclick = async (e) => {
    const job = jobsCache.find(j=>j.id===e.target.closest('.job').dataset.id);
    await downloads.save({ filename: `${job.company}_${job.title}_cover_letter.txt`.replace(/\s+/g,'_'), data: job.coverLetter }).catch(()=>{});
  });
}

// ---------- Notifications ----------
async function addNotification(message, actionNeeded){
  const id = uid();
  await db.doc('profiles/'+profileId+'/notifications/'+id).set({ message, actionNeeded: !!actionNeeded, read: false, emailed: false, createdAt: Date.now() });
}

function renderNotifsTab(body){
  if (!notifsCache.length){
    body.innerHTML = '<div class="card muted">No notifications yet. You\'ll see updates here when a resume is tailored, a job needs your attention, or a status changes.</div>';
    return;
  }
  body.innerHTML = `
    <div class="card">
      ${notifsCache.map(n => `
        <div class="notif ${n.read?'':'unread'}" data-id="${n.id}">
          <div>
            ${n.actionNeeded ? '<span class="pill pill-need">Action needed</span> ' : ''}
            <div style="margin-top:6px;">${esc(n.message)}</div>
            <div class="small" style="margin-top:4px;">${new Date(n.createdAt).toLocaleString()}</div>
          </div>
          ${!n.read ? '<button class="btn-ghost notif-read" style="padding:6px 10px; font-size:12px; white-space:nowrap;">Mark read</button>' : ''}
        </div>
      `).join('')}
    </div>
    <div class="small">Email alerts to your notification email (set in the Profile tab) are sent by a companion process your Career Copilot administrator schedules — ask them to confirm it's active if you're expecting emails.</div>
  `;
  $$('.notif-read', body).forEach(btn => btn.onclick = async (e) => {
    const id = e.target.closest('.notif').dataset.id;
    await db.doc('profiles/'+profileId+'/notifications/'+id).update({ read: true });
  });
}

init();
</script>
