  function workSearchRows(fromDate, toDate){
    var from = fromDate ? new Date(fromDate + "T00:00:00").getTime() : null;
    var to = toDate ? new Date(toDate + "T23:59:59").getTime() : null;
    return state.jobs
      .filter(function(j){ return !!j.appliedAt; })
      .filter(function(j){ return (from==null || j.appliedAt >= from) && (to==null || j.appliedAt <= to); })
      .sort(function(a,b){ return a.appliedAt - b.appliedAt; })
      .map(function(j){
        return {
          date: new Date(j.appliedAt).toLocaleDateString(),
          employer: j.company || "",
          position: j.title || "",
          method: "Online",
          contact: j.url || "",
          result: stageLabel(j.status)
        };
      });
  }

  async function downloadWorkSearchPdf(fromDate, toDate){
    var rows = workSearchRows(fromDate, toDate);
    var jsPDF = await loadJsPdf();
    var doc = new jsPDF({ unit: "pt", format: "letter" });
    var name = state.profile.name || currentUserDisplay || "";
    var marginX = 40, y = 50;
    doc.setFont("helvetica", "bold"); doc.setFontSize(16);
    doc.text("Job Search / Work Search Log", marginX, y); y += 22;
    doc.setFont("helvetica", "normal"); doc.setFontSize(10);
    if (name) { doc.text("Name: " + name, marginX, y); y += 14; }
    doc.text("Generated: " + new Date().toLocaleDateString(), marginX, y); y += 14;
    if (fromDate || toDate) { doc.text("Range: " + (fromDate||"…") + " to " + (toDate||"…"), marginX, y); y += 14; }
    y += 8;

    var cols = [
      { key:"date", label:"Date Applied", w:70 },
      { key:"employer", label:"Employer", w:120 },
      { key:"position", label:"Position", w:120 },
      { key:"method", label:"Method", w:55 },
      { key:"result", label:"Result", w:65 },
      { key:"contact", label:"Posting URL", w:110 }
    ];
    function drawHeader(){
      doc.setFont("helvetica", "bold"); doc.setFontSize(9);
      var x = marginX;
      cols.forEach(function(c){ doc.text(c.label, x, y); x += c.w; });
      y += 6;
      doc.setDrawColor(180); doc.line(marginX, y, marginX + cols.reduce(function(s,c){return s+c.w;},0), y);
      y += 12;
      doc.setFont("helvetica", "normal");
    }
    drawHeader();
    if (!rows.length){
      doc.setFontSize(10);
      doc.text("No applications recorded yet for this range.", marginX, y);
      y += 16;
    }
    rows.forEach(function(r){
      if (y > 740){ doc.addPage(); y = 50; drawHeader(); }
      var x = marginX;
      cols.forEach(function(c){
        var val = String(r[c.key] || "");
        var maxChars = Math.floor(c.w / 4.3);
        if (val.length > maxChars) val = val.slice(0, maxChars - 1) + "…";
        doc.text(val, x, y);
        x += c.w;
      });
      y += 15;
    });

    var stamp = new Date().toISOString().slice(0,10);
    doc.save("work-search-log-" + stamp + ".pdf");
  }

  function downloadWorkSearchCsv(fromDate, toDate){
    var rows = workSearchRows(fromDate, toDate);
    var header = ["Date Applied","Employer","Position","Method","Result","Posting URL"];
    var csvEsc = function(v){ v = String(v==null?"":v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
    var lines = [header.join(",")].concat(rows.map(function(r){
      return [r.date, r.employer, r.position, r.method, r.result, r.contact].map(csvEsc).join(",");
    }));
    var stamp = new Date().toISOString().slice(0,10);
    saveFile("work-search-log-" + stamp + ".csv", lines.join("\n"));
  }

  async function copyText(text){
    try { await navigator.clipboard.writeText(text||""); toast("Copied."); }
    catch(e){ toast("Copy failed — select the text manually."); }

  async function saveFile(name, text){
    text = String(text||"");
    try {
      var blob = new Blob([text], { type: name.slice(-5) === ".json" ? "application/json" : (name.slice(-4) === ".ics" ? "text/calendar" : "text/plain") });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      return;
    } catch(e){}
    try { await navigator.clipboard.writeText(text); toast("Download blocked — copied to clipboard instead."); return; }
    catch(e){}
    showTextFallback(name, text);
  }
  function showTextFallback(name, text){
    var ov = document.createElement("div");
    ov.style.cssText = "position:fixed; inset:0; background:rgba(10,18,26,.55); z-index:60; display:flex; align-items:center; justify-content:center; padding:20px;";
    ov.innerHTML = '<div style="background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); max-width:640px; width:100%; padding:18px;">' +
      '<div style="font-family:var(--serif); font-weight:600; text-transform:uppercase; letter-spacing:.05em; font-size:13px; margin-bottom:8px;">'+esc(name)+'</div>' +
      '<div style="font-size:12.5px; color:var(--muted); margin-bottom:8px;">Select all and copy — saving files isn’t available in this view.</div>' +
      '<textarea readonly rows="12" style="width:100%; font-family:var(--mono); font-size:12px;"></textarea>' +
      '<div class="btn-row" style="margin-top:10px; justify-content:flex-end;"><button class="btn-ghost" data-x>Close</button></div>' +
    '</div>';
    ov.querySelector("textarea").value = text;
    ov.querySelector("[data-x]").onclick = function(){ ov.remove(); };
    ov.onclick = function(e){ if (e.target===ov) ov.remove(); };
    document.body.appendChild(ov);
    var ta = ov.querySelector("textarea"); ta.focus(); ta.select();
  }

            '<div><label for="l-linkedin">'+esc(t("linkedinLabel"))+'</label><input id="l-linkedin" value="'+esc(L.linkedin||"")+'" placeholder="https://linkedin.com/in/…"></div>' +
            '<div><label for="l-indeed">'+esc(t("indeedLabel"))+'</label><input id="l-indeed" value="'+esc(L.indeed||"")+'"></div>' +
          '</div>' +
          '<div class="grid2">' +
            '<div><label for="l-portfolio">'+esc(t("portfolioLabel"))+'</label><input id="l-portfolio" value="'+esc(L.portfolio||"")+'"></div>' +
            '<div><label for="l-other">'+esc(t("otherLabel"))+'</label><input id="l-other" value="'+esc(L.other||"")+'"></div>' +
          '</div>' +
          '<div class="btn-row"><button class="btn-primary" id="l-save">'+esc(t("saveLinksBtn"))+'</button><span class="saveflash" id="l-flash"></span></div>' +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        '<h3>'+esc(t("resumeH"))+'</h3>' +
        '<div class="lede">'+esc(t("resumeLede"))+'</div>' +
        '<input type="file" id="p-file" accept=".txt,.md,.pdf,text/plain,application/pdf" style="margin-bottom:10px; font-size:13px;">' +
        '<textarea id="p-resume" rows="16" placeholder="Paste your résumé here…">'+esc(p.resumeText||"")+'</textarea>' +
        '<div class="btn-row" style="margin-top:12px;"><button class="btn-primary" id="p-save-resume">'+esc(t("saveResumeBtn"))+'</button><span class="saveflash" id="r-flash"></span></div>' +
      '</div>' +
      certsCardHtml() +
      answersCardHtml() +
      '<div class="card">' +
        '<h3>'+esc(t("coverLetterCardH"))+'</h3>' +
        '<div class="lede">'+esc(t("coverLetterCardLede"))+'</div>' +
        '<input type="file" id="p-cl-file" accept=".txt,.md,.pdf,text/plain,application/pdf" style="margin-bottom:10px; font-size:13px;">' +
        '<textarea id="p-coverletter" rows="12" placeholder="Paste your cover letter here…">'+esc(p.coverLetterText||"")+'</textarea>' +
        '<div class="btn-row" style="margin-top:12px;"><button class="btn-primary" id="p-save-cl">'+esc(t("saveCoverLetterBtn"))+'</button><span class="saveflash" id="cl-flash"></span></div>' +
      '</div>' +
      '<div class="card">' +
        '<h3>'+esc(t("workLogH"))+'</h3>' +
        '<div class="lede">'+esc(t("workLogLede"))+'</div>' +
        '<div class="stack">' +
          '<label style="display:flex; align-items:center; gap:8px; text-transform:none; font-weight:400; cursor:pointer;">' +
            '<input type="checkbox" id="p-uic" style="width:auto;"'+(p.claimingUnemployment?" checked":"")+'> '+esc(t("claimingUiLabel")) +
          '</label>' +
          (p.claimingUnemployment ? (
            '<div><label for="p-uiagency">'+esc(t("uiAgencyLabel"))+'</label><input id="p-uiagency" value="'+esc(p.uiAgencyName||"")+'" placeholder="'+esc(t("uiAgencyPlaceholder"))+'"></div>' +
            '<div class="grid2">' +
              '<div><label for="p-uifrom">'+esc(t("uiFromLabel"))+'</label><input id="p-uifrom" type="date" value="'+esc(p.uiFrom||"")+'"></div>' +
              '<div><label for="p-uito">'+esc(t("uiToLabel"))+'</label><input id="p-uito" type="date" value="'+esc(p.uiTo||"")+'"></div>' +
            '</div>' +
            '<div class="btn-row">' +
              '<button class="btn-primary" id="p-uic-save">'+esc(t("saveBtn"))+'</button>' +
              '<button class="btn-ghost" id="p-uic-pdf">'+esc(t("downloadLogPdfBtn"))+'</button>' +
              '<button class="btn-ghost" id="p-uic-csv">'+esc(t("downloadLogCsvBtn"))+'</button>' +
              '<span class="saveflash" id="ui-flash"></span>' +
            '</div>'
          ) : "") +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        '<h3>'+esc(t("backupH"))+'</h3>' +
        '<div class="lede">'+esc(t("backupLede"))+'</div>' +
        '<div class="btn-row">' +
          '<button class="btn-ghost" id="p-backup">'+esc(t("downloadBackupBtn"))+'</button>' +
          '<button class="btn-ghost" id="p-restore-btn">'+esc(t("restoreBtn"))+'</button>' +
          '<input type="file" id="p-restore" accept="application/json,.json" hidden>' +
        '</div>' +
      '</div>' +
      deviceCardHtml() +
      '<div class="card">' +
        '<h3>Tell a friend about Cindy</h3>' +
        '<div class="lede">Know someone job-hunting or trying to get their money on track? Send them the link.</div>' +
        '<div class="btn-row"><button class="btn-ghost" id="p-share">Share Cindy</button></div>' +
      '</div>' +
      '<div class="card">' +
        '<h3>Delete my account</h3>' +
        '<div class="lede">Permanently deletes your account and everything stored for it (profile, résumé, pipeline, saved answers, chats). This can’t be undone — download a backup first if you want a copy.</div>' +
        '<div class="btn-row"><button class="btn-danger" id="p-delete-acct">Delete my account…</button></div>' +
      '</div>';

    $("#p-delete-acct").onclick = onDeleteAccount;
    $("#p-share").onclick = shareCindy;
    wireDevice();
    $("#p-save").onclick = async function(){
      state.profile.name = $("#p-name").value.trim();
      state.profile.location = $("#p-loc").value.trim();
      state.profile.email = $("#p-email").value.trim();
      state.profile.phone = $("#p-phone").value.trim();
      state.profile.targetRoles = $("#p-roles").value.trim();
      state.profile.updatedAt = now();
      await persistMain();
      flash("#p-flash"); render();
    };
    $("#l-save").onclick = async function(){
      state.profile.links = {
        linkedin: $("#l-linkedin").value.trim(), indeed: $("#l-indeed").value.trim(),
        portfolio: $("#l-portfolio").value.trim(), other: $("#l-other").value.trim()
      };
      await persistMain();
      flash("#l-flash");
    };
    $("#p-save-resume").onclick = async function(){
      state.profile.resumeText = $("#p-resume").value;
      await persistMain();
      flash("#r-flash");
    };
    $("#p-file").onchange = async function(e){
      var f = e.target.files[0]; if (!f) return;
      var isPdf = /\.pdf$/i.test(f.name || "");
      if (isPdf) toast("Reading PDF…");
      try {
        var text = await extractResumeFile(f);
        $("#p-resume").value = text;
        toast("Loaded — press Save résumé to keep it.");
      } catch(err){ toast((err && err.message) || "Couldn’t read that file."); }
      e.target.value = "";
    };
    wireCerts();
    wireAnswers();
    $("#p-save-cl").onclick = async function(){
      state.profile.coverLetterText = $("#p-coverletter").value;
      await persistMain();
      flash("#cl-flash");
    };
    $("#p-cl-file").onchange = async function(e){
      var f = e.target.files[0]; if (!f) return;
      var isPdf = /\.pdf$/i.test(f.name || "");
      if (isPdf) toast("Reading PDF…");
      try {
        var text = await extractResumeFile(f);
        $("#p-coverletter").value = text;
        toast("Loaded — press Save cover letter to keep it.");
      } catch(err){ toast((err && err.message) || "Couldn’t read that file."); }
      e.target.value = "";
    };
    $("#p-uic").onchange = async function(){
      state.profile.claimingUnemployment = $("#p-uic").checked;
      await persistMain();
      render();
    };
    var uicSave = $("#p-uic-save");
    if (uicSave) uicSave.onclick = async function(){
      state.profile.uiAgencyName = $("#p-uiagency").value.trim();
      state.profile.uiFrom = $("#p-uifrom").value;
      state.profile.uiTo = $("#p-uito").value;
      await persistMain();
      flash("#ui-flash");
    };
    var uicPdf = $("#p-uic-pdf");
    if (uicPdf) uicPdf.onclick = function(){
      downloadWorkSearchPdf($("#p-uifrom").value, $("#p-uito").value).catch(function(err){
        toast((err && err.message) || "Couldn’t build the PDF.");
      });
    };
    var uicCsv = $("#p-uic-csv");
    if (uicCsv) uicCsv.onclick = function(){
      downloadWorkSearchCsv($("#p-uifrom").value, $("#p-uito").value);
    };
    $("#p-backup").onclick = function(){
      var stamp = new Date().toISOString().slice(0,10);
      saveFile("career-copilot-backup-" + stamp + ".json",
        JSON.stringify({ v:1, exportedAt:now(), profile:state.profile, activity:state.activity, jobs:state.jobs }, null, 2));
    };
    $("#p-restore-btn").onclick = function(){ $("#p-restore").click(); };
    $("#p-restore").onchange = function(e){
      var f = e.target.files[0]; if (!f) return;
      var reader = new FileReader();
      reader.onload = async function(){
        var data;
        try { data = JSON.parse(String(reader.result||"")); }
        catch(err){ toast("That file isn’t a valid backup."); return; }
        if (!data || (!data.profile && !data.jobs)){ toast("That file isn’t a Career Copilot backup."); return; }
        if (!confirm("Replace everything currently in this browser with the backup?")) return;
        state.profile = Object.assign({ links:{} }, data.profile || {});
        state.profile.links = state.profile.links || {};
        state.activity = Array.isArray(data.activity) ? data.activity : [];
        state.jobs = Array.isArray(data.jobs) ? data.jobs : [];
        saveLocal();
        toast("Backup restored.");
        render();
      };
      reader.readAsText(f);
    };
  }
  function flash(sel){
    var el = $(sel); if (!el) return;
    el.textContent = "Saved " + new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
    setTimeout(function(){ if (el) el.textContent = ""; }, 2600);
  }

  // ---------- Activity ----------
  function renderActivity(b){
    if (!state.activity.length){
      b.innerHTML = '<div class="card"><div class="empty">'+esc(t("noActivityYet"))+'</div></div>';
      return;
    }
    b.innerHTML = '<div class="card"><div class="btn-row" style="justify-content:space-between; margin-bottom:12px;">' +
        '<h3>'+esc(t("activityLogH"))+'</h3>' +
        (unreadCount() ? '<button class="btn-ghost" id="a-read" style="font-size:12px; padding:6px 12px;">'+esc(t("markAllReadBtn"))+'</button>' : "") +
      '</div>' +
      state.activity.map(function(a){
        return '<div style="display:flex; gap:10px; padding:9px 0; border-top:1px solid var(--border);">' +
          '<span class="mono" style="font-size:11px; color:var(--faint); white-space:nowrap; padding-top:2px;">'+
            esc(new Date(a.at).toLocaleDateString([], {month:"short", day:"numeric"})) +'</span>' +
          '<span style="font-size:13.5px;'+ (a.read ? "" : "font-weight:500;") +'">'+esc(a.message)+'</span>' +
        '</div>';
      }).join("") +
    '</div>';
    var r = $("#a-read");
    if (r) r.onclick = async function(){
      state.activity.forEach(function(a){ a.read = true; });
      await persistMain(); render();
    };
  }

  // ---------- theme ----------
  function toggleTheme(){
    var root = document.documentElement;
    var cur = root.getAttribute("data-theme");
    var next;
    if (cur === "dark") next = "light";
    else if (cur === "light") next = "dark";
    else next = matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("career-copilot-theme", next); } catch(e){}
  }
  try {
    var savedTheme = localStorage.getItem("career-copilot-theme");
    if (savedTheme === "light" || savedTheme === "dark") document.documentElement.setAttribute("data-theme", savedTheme);
  } catch(e){}

  // ---------- boot ----------
  (function boot(){
    var token = getSession();
    if (!token){ renderAuth(); return; }
    authToken = token;
    apiRequest("/api/account/session", { method:"GET", token:token }).then(function(res){
      enterAccount((res.username||"").toLowerCase(), res.username, token, res.data);
    }).catch(function(err){
      if (err && err.status){          // the server answered and rejected the session → sign in again
        clearSession();
        authToken = null;
        renderAuth();
        return;
      }
      // no connection: keep the saved sign-in and let the person retry (don't log them out)
      app.innerHTML = '<div class="auth-hero" style="margin-top:40px;"><img src="assets/logo-full.png" alt="Cindy Career Copilot"></div>' +
        '<div class="card" style="max-width:420px; margin:0 auto; text-align:center;"><h2>You’re offline</h2>' +
        '<div class="lede">Cindy needs a connection to load your account. Your data is safe — reconnect and try again.</div>' +
        '<div class="btn-row" style="justify-content:center;"><button class="btn-primary" id="offline-retry">Try again</button></div></div>';
      var rb = document.getElementById("offline-retry"); if (rb) rb.onclick = function(){ location.reload(); };
    });
  })();

  // ---------- native app extras (iPhone app via Capacitor). The website ignores all of this. ----------
  var NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  if (NATIVE){
    var NP = window.Capacitor.Plugins || {};
    document.documentElement.classList.add("native-app");
    // links that open a new tab → the in-app browser sheet (relative links are resolved against the live site)
    document.addEventListener("click", function(e){
      var a = e.target.closest && e.target.closest("a[href]");
      if (!a || a.target !== "_blank" || !NP.Browser) return;
      e.preventDefault();
      var url; try { url = new URL(a.getAttribute("href"), "https://cindy-career-copilot.pages.dev/").toString(); } catch(err){ return; }
      NP.Browser.open({ url: url });
    }, true);
    // a light tap on tabs and main buttons
    document.addEventListener("click", function(e){
      if (NP.Haptics && e.target.closest && e.target.closest(".tab, .btn-primary")) { try { NP.Haptics.impact({ style: "LIGHT" }); } catch(err){} }
    }, true);
  }
  function shareCindy(){
    var data = { title:"Cindy Career Copilot", text:"Cindy helps with jobs, résumés, credit, and finding help and income. Try it:", url:"https://cindy-career-copilot.pages.dev/" };
    if (NATIVE && window.Capacitor.Plugins && window.Capacitor.Plugins.Share){ window.Capacitor.Plugins.Share.share(data).catch(function(){}); return; }
    if (navigator.share){ navigator.share(data).catch(function(){}); return; }
    copyText(data.url); toast("Link copied — send it to a friend.");
  }

  // ---------- Face ID lock + reminder notifications (native app only; settings live on this phone) ----------
  function devPrefs(){ try { return JSON.parse(localStorage.getItem("cindy-device-prefs") || "{}"); } catch(e){ return {}; } }
  function saveDevPrefs(p){ try { localStorage.setItem("cindy-device-prefs", JSON.stringify(p)); } catch(e){} }
  function plug(n){ return (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins[n]) || null; }

  var lockEl = null, lockBusy = false, awaySince = 0;
  function showLock(){
    if (lockEl) return;
    lockEl = document.createElement("div");
    lockEl.id = "cindy-lock";
    lockEl.style.cssText = "position:fixed; inset:0; z-index:9999; background:var(--ground); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:24px; text-align:center;";
    lockEl.innerHTML = '<img src="assets/logo-badge.png" alt="" style="width:110px; height:auto;">' +
      '<div style="font-weight:700; font-size:20px;">Cindy is locked</div>' +
      '<div class="age">Unlock to see your job search.</div>' +
      '<button class="btn-primary" id="cindy-unlock" style="min-width:190px;">Unlock</button>' +
      '<button class="btn-ghost" id="cindy-lock-out" style="font-size:12px;">Can’t unlock? Log out</button>';
    document.body.appendChild(lockEl);
    lockEl.querySelector("#cindy-unlock").onclick = tryUnlock;
    lockEl.querySelector("#cindy-lock-out").onclick = function(){
      var p = devPrefs(); p.lock = false; saveDevPrefs(p);
      hideLock(); logout();
    };
    tryUnlock();
  }
  function hideLock(){ if (lockEl && lockEl.parentNode) lockEl.parentNode.removeChild(lockEl); lockEl = null; }
  async function tryUnlock(){
    if (lockBusy) return;
    lockBusy = true;
    var B = plug("NativeBiometric");
    try {
      if (!B) throw new Error("no biometric plugin");
      await B.verifyIdentity({ reason:"Unlock Cindy", title:"Unlock Cindy", subtitle:"Your job search is private", useFallback:true, maxAttempts:5 });
      hideLock();
    } catch(e){ /* stay locked — the person can tap Unlock again */ }
    lockBusy = false;
  }
  async function setLock(on){
    var p = devPrefs();
    if (!on){ p.lock = false; saveDevPrefs(p); return true; }
    var B = plug("NativeBiometric");
    try {
      var av = B && await B.isAvailable({ useFallback:true });
      if (!av || !av.isAvailable){ toast("Face ID / Touch ID isn’t set up on this phone. Turn it on in your phone’s Settings first."); return false; }
      await B.verifyIdentity({ reason:"Turn on the Cindy lock", title:"Turn on lock", useFallback:true });
    } catch(e){ toast("Couldn’t verify it’s you — the lock wasn’t turned on."); return false; }
    p.lock = true; saveDevPrefs(p);
    return true;
  }

  function hash32(s){ var h = 2166136261; for (var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 2000000000) + 1; }
  function at9am(ts){ var d = new Date(ts); d.setHours(9, 0, 0, 0); return d; }
  // everything is worked out on the phone from the saved jobs and certificates; nothing is sent anywhere
  function buildReminders(){
    var p = devPrefs(), out = [], nowT = Date.now(), DAY = 86400000;
    function add(key, title, body, when){ if (when.getTime() > nowT + 60000) out.push({ id:hash32(key), title:title, body:body, schedule:{ at:when } }); }
    if (p.followups) (state.jobs || []).forEach(function(j){
      if (j.status === "applied" && j.appliedAt) add("fu:" + j.id, "Time to follow up", "It’s been a week since you applied for " + j.title + " at " + j.company + ". A short, polite note can help.", at9am(j.appliedAt + 7 * DAY));
      if ((j.status === "tailored" || j.status === "saved") && j.tailoredResume && !j.appliedAt) add("rd:" + j.id, "Ready to send?", "Your résumé and cover letter for " + j.title + " at " + j.company + " are ready — apply today.", at9am((j.updatedAt || j.createdAt || nowT) + 2 * DAY));
    });
    if (p.certs) certList().forEach(function(c){
      if (!c.expires) return;
      var base = new Date(c.expires + "T09:00:00").getTime();
      [[30, "in 30 days"], [7, "in 7 days"], [0, "today"]].forEach(function(x){
        add("ce:" + c.id + ":" + x[0], "Certificate or license expiring", c.name + " expires " + x[1] + ". Renew it so you can keep applying.", new Date(base - x[0] * DAY));
      });
    });
    var weekly = p.weekly ? { id:hash32("weekly"), title:"New week, new applications", body:"Pick three jobs to apply to this week — Cindy will get your materials ready.", schedule:{ on:{ weekday:2, hour:9, minute:0 }, allowWhileIdle:true } } : null;
    return { items: out.slice(0, 50), weekly: weekly };
  }
  async function cancelAllReminders(){
    var LN = plug("LocalNotifications"); if (!LN) return;
    try { var pend = await LN.getPending(); if (pend && pend.notifications && pend.notifications.length) await LN.cancel({ notifications: pend.notifications.map(function(n){ return { id:n.id }; }) }); } catch(e){}
  }
  async function scheduleReminders(){
    var LN = plug("LocalNotifications"); if (!LN || !currentUser) return;
    var p = devPrefs();
    try {
      await cancelAllReminders();
      if (!(p.followups || p.certs || p.weekly)) return;
      var perm = await LN.checkPermissions();
      if (!perm || perm.display !== "granted") return;
      var plan = buildReminders(), list = plan.items.slice();
      if (plan.weekly) list.push(plan.weekly);
      if (list.length) await LN.schedule({ notifications: list });
    } catch(e){}
  }
  var remTimer = null;
  function scheduleRemindersSoon(){ if (!NATIVE) return; clearTimeout(remTimer); remTimer = setTimeout(scheduleReminders, 1500); }
  async function askNotificationPermission(){
    var LN = plug("LocalNotifications"); if (!LN) return false;
    try {
      var perm = await LN.checkPermissions();
      if (perm && perm.display === "granted") return true;
      perm = await LN.requestPermissions();
      if (perm && perm.display === "granted") return true;
    } catch(e){}
    toast("Notifications are off for Cindy. Turn them on in your phone’s Settings → Notifications → Cindy.");
    return false;
  }

  function deviceCardHtml(){
    if (!NATIVE) return '<div class="card"><h3>Lock &amp; reminders</h3><div class="lede">Face ID lock and reminder notifications are available in the Cindy mobile app (iPhone and Android).</div></div>';
    var p = devPrefs();
    function chk(id, label, on){ return '<label class="chk"><input type="checkbox" id="'+id+'"'+(on ? " checked" : "")+'> '+esc(label)+'</label>'; }
    return '<div class="card"><h3>Lock &amp; reminders</h3>' +
      '<div class="lede">Keep your job search private and never miss a follow-up. These settings are for this phone only.</div>' +
      '<div class="stack">' +
        chk("dv-lock", "Lock Cindy with Face ID / Touch ID", p.lock) +
        chk("dv-fu", "Follow-up reminders — a week after you apply, and when your materials are ready to send", p.followups) +
        chk("dv-ce", "Remind me before a certificate or license expires", p.certs) +
        chk("dv-wk", "Monday-morning nudge to apply", p.weekly) +
        '<div class="btn-row"><button class="btn-ghost" id="dv-test">Send a test reminder</button></div>' +
        '<div class="age">The lock asks for Face ID or your phone passcode when you open Cindy or come back after a short time away. Reminders are created on your phone and stay on it.</div>' +
      '</div></div>';
  }
  function wireDevice(){
    if (!NATIVE || !$("#dv-lock")) return;
    $("#dv-lock").onchange = async function(){
      var el = $("#dv-lock"), want = el.checked;
      var ok = await setLock(want);
      if (!ok) el.checked = !want;
      else toast(want ? "Cindy will ask for Face ID when you open it." : "Lock turned off.");
    };
    [["dv-fu", "followups"], ["dv-ce", "certs"], ["dv-wk", "weekly"]].forEach(function(pair){
      $("#" + pair[0]).onchange = async function(){
        var el = $("#" + pair[0]), want = el.checked;
        if (want && !(await askNotificationPermission())){ el.checked = false; return; }
        var p = devPrefs(); p[pair[1]] = want; saveDevPrefs(p);
        scheduleReminders();
        toast(want ? "Reminders on." : "Reminders off.");
      };
    });
    $("#dv-test").onclick = async function(){
      if (!(await askNotificationPermission())) return;
      try {
        await plug("LocalNotifications").schedule({ notifications:[{ id:hash32("test"), title:"Cindy", body:"This is a test reminder. You’re all set!", schedule:{ at:new Date(Date.now() + 5000) } }] });
        toast("Test reminder coming in 5 seconds…");
      } catch(e){ toast("Couldn’t schedule the test reminder."); }
    };
  }

  if (NATIVE){
    if (devPrefs().lock) showLock();
    var AppP = plug("App");
    if (AppP && AppP.addListener) AppP.addListener("appStateChange", function(st){
      if (!devPrefs().lock) return;
      if (!st.isActive){ awaySince = Date.now(); return; }
      if (awaySince && Date.now() - awaySince > 20000) showLock();
    });
  }

  if (LANG !== "en"){ trLoad(); startObserver(); setTimeout(trRun, 0); }

  // offline-capable shell (also what lets the Android app open instantly)
  if (!NATIVE && "serviceWorker" in navigator && location.protocol === "https:") {
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
})();
</script>
