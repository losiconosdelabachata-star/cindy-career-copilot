<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Search Deck</title>
<meta name="description" content="A private, per-person job-search command deck — pipeline tracker, résumé storage, and stalled-item alerts, saved in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
html,body{margin:0;}
img{max-width:100%;}
[hidden]{display:none!important;}
:root{
  --ground:#eef1f4; --panel:#ffffff; --panel-2:#f5f8fa; --inset:#eceff2;
  --ink:#17232e; --muted:#5c6f7f; --faint:#8496a3; --border:#d6dde4;
  --accent:#256a86; --accent-deep:#1b5470; --accent-ghost:#e1edf1; --on-accent:#ffffff;
  --amber:#9c5f18; --amber-ghost:#f5e6d3;
  --green:#2b7a57; --green-ghost:#dbeee4;
  --violet:#565aa4; --violet-ghost:#e4e4f1;
  --danger:#a4423a; --danger-ghost:#f4e0de;
  --shadow:0 1px 2px rgba(20,35,46,.05), 0 6px 20px rgba(20,35,46,.06);
  --radius:6px;
  --maxw:940px;
  --serif:"Barlow Semi Condensed",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --body:"Barlow",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0d151d; --panel:#151f29; --panel-2:#1a2530; --inset:#1f2c38;
    --ink:#e5edf3; --muted:#8ba0b0; --faint:#6c8090; --border:#273743;
    --accent:#5bb2d1; --accent-deep:#83c8e0; --accent-ghost:#16303b; --on-accent:#08141b;
    --amber:#dda355; --amber-ghost:#372a17;
    --green:#5cc596; --green-ghost:#183025;
    --violet:#9a9ce4; --violet-ghost:#22233d;
    --danger:#e2867d; --danger-ghost:#3a221f;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#0d151d; --panel:#151f29; --panel-2:#1a2530; --inset:#1f2c38;
  --ink:#e5edf3; --muted:#8ba0b0; --faint:#6c8090; --border:#273743;
  --accent:#5bb2d1; --accent-deep:#83c8e0; --accent-ghost:#16303b; --on-accent:#08141b;
  --amber:#dda355; --amber-ghost:#372a17;
  --green:#5cc596; --green-ghost:#183025;
  --violet:#9a9ce4; --violet-ghost:#22233d;
  --danger:#e2867d; --danger-ghost:#3a221f;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{
  background:var(--ground); color:var(--ink);
  font-family:var(--body); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:var(--maxw); margin:0 auto; padding:26px 20px 96px;}
h1,h2,h3{font-family:var(--serif); font-weight:600; letter-spacing:.005em; margin:0;}
h1{font-size:24px; letter-spacing:.02em; text-transform:uppercase;}
h2{font-size:18px;}
h3{font-size:15.5px;}
p{margin:0 0 10px;}
a{color:var(--accent-deep);}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums;}

/* ---- masthead ---- */
.masthead{display:flex; align-items:baseline; justify-content:space-between; gap:14px; margin-bottom:18px; flex-wrap:wrap;}
.brand{display:flex; align-items:baseline; gap:11px;}
.brand .tag{font-family:var(--mono); font-size:11px; color:var(--faint); letter-spacing:.14em; text-transform:uppercase;}
.owner{font-family:var(--mono); font-size:12px; color:var(--muted);}
.iconbtn{background:transparent; border:1px solid var(--border); color:var(--muted); border-radius:var(--radius); padding:5px 9px; font-size:12px; cursor:pointer; font-family:var(--mono);}
.iconbtn:hover{border-color:var(--accent); color:var(--accent-deep);}

/* ---- flight strip ---- */
.strip{display:grid; grid-template-columns:repeat(5,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:22px;}
.cell{background:var(--panel); padding:11px 12px 12px; display:flex; flex-direction:column; gap:3px;}
.cell .n{font-family:var(--mono); font-size:22px; font-weight:500; line-height:1;}
.cell .k{font-family:var(--serif); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);}
.cell.on-saved .n{color:var(--ink);}
.cell.on-tailored .n{color:var(--accent);}
.cell.on-applied .n{color:var(--green);}
.cell.on-interview .n{color:var(--violet);}
.cell.on-closed .n{color:var(--faint);}
@media (max-width:560px){
  .strip{grid-template-columns:repeat(3,1fr);}
  .cell:nth-child(4),.cell:nth-child(5){border-top:1px solid var(--border);}
}

/* ---- tabs ---- */
.tabs{display:flex; gap:2px; border-bottom:1px solid var(--border); margin-bottom:22px;}
.tab{appearance:none; background:transparent; border:none; border-bottom:2px solid transparent; margin-bottom:-1px;
  padding:9px 15px; font-family:var(--serif); font-weight:600; font-size:14px; text-transform:uppercase; letter-spacing:.06em;
  color:var(--muted); cursor:pointer;}
.tab:hover{color:var(--ink);}
.tab[aria-selected="true"]{color:var(--accent-deep); border-bottom-color:var(--accent);}
.tab .badge{font-family:var(--mono); font-size:11px; background:var(--amber-ghost); color:var(--amber); padding:1px 5px; border-radius:4px; margin-left:6px; letter-spacing:0;}

/* ---- cards ---- */
.card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; margin-bottom:16px;}
.card > h2, .card > h3{margin-bottom:4px;}
.card .lede{color:var(--muted); font-size:13.5px; margin-bottom:16px;}
.stack{display:flex; flex-direction:column; gap:14px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media (max-width:560px){ .grid2{grid-template-columns:1fr;} }

label{display:block; font-family:var(--serif); font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:5px;}
input,textarea,select{
  width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--ink);
  border-radius:var(--radius); padding:9px 11px; font-family:var(--body); font-size:14.5px;
}
textarea{resize:vertical; min-height:84px; line-height:1.5;}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);}
input::placeholder,textarea::placeholder{color:var(--faint);}

button{font-family:var(--serif); font-weight:600; font-size:13.5px; text-transform:uppercase; letter-spacing:.05em;
  border:1px solid transparent; border-radius:var(--radius); padding:9px 16px; cursor:pointer;}
button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.btn-primary{background:var(--accent); color:var(--on-accent); border-color:var(--accent);}
.btn-primary:hover{background:var(--accent-deep); border-color:var(--accent-deep);}
.btn-ghost{background:transparent; color:var(--ink); border-color:var(--border);}
.btn-ghost:hover{border-color:var(--accent); color:var(--accent-deep);}
.btn-danger{background:transparent; color:var(--danger); border-color:var(--danger);}
.btn-danger:hover{background:var(--danger-ghost);}
button:disabled{opacity:.45; cursor:not-allowed;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
.saveflash{font-family:var(--mono); font-size:12px; color:var(--green);}

/* ---- job cards ---- */
.job{position:relative; background:var(--panel); border:1px solid var(--border); border-left-width:4px; border-radius:var(--radius); padding:16px 16px 16px 17px; margin-bottom:12px;}
.job.s-saved{border-left-color:var(--faint);}
.job.s-tailored{border-left-color:var(--accent);}
.job.s-applied{border-left-color:var(--green);}
.job.s-interview{border-left-color:var(--violet);}
.job.s-closed{border-left-color:var(--border); opacity:.72;}
.job-head{display:flex; justify-content:space-between; gap:12px; align-items:flex-start;}
.job-head h3{font-family:var(--serif); font-size:16px;}
.job-co{font-family:var(--body); font-size:13.5px; color:var(--muted); margin-top:1px;}
.job-meta{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:9px;}
.stat{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.04em; padding:2px 7px; border-radius:4px;}
.stat.s-saved{background:var(--inset); color:var(--muted);}
.stat.s-tailored{background:var(--accent-ghost); color:var(--accent-deep);}
.stat.s-applied{background:var(--green-ghost); color:var(--green);}
.stat.s-interview{background:var(--violet-ghost); color:var(--violet);}
.stat.s-closed{background:var(--inset); color:var(--faint);}
.age{font-family:var(--mono); font-size:11px; color:var(--faint);}
.job details{margin-top:11px;}
.job details summary{font-family:var(--mono); font-size:12px; color:var(--muted); cursor:pointer;}
.job details .desc{white-space:pre-wrap; font-size:13px; color:var(--muted); margin-top:8px; max-height:220px; overflow:auto; padding-right:6px;}
.job-actions{display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin-top:13px;}
.job-actions select{width:auto; padding:7px 9px; font-size:13px;}
.out{white-space:pre-wrap; font-family:var(--body); font-size:13px; line-height:1.55; background:var(--panel-2); border:1px solid var(--border); border-radius:var(--radius); padding:13px; max-height:340px; overflow:auto; margin-top:8px;}
.out-h{font-family:var(--serif); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-top:14px;}

/* ---- today ---- */
.plan{white-space:pre-wrap; font-size:14.5px; line-height:1.6;}
.thinking{font-family:var(--mono); font-size:13px; color:var(--muted);}
.stalled li{margin-bottom:6px;}
.pill{display:inline-block; font-family:var(--mono); font-size:11px; padding:1px 6px; border-radius:4px; background:var(--amber-ghost); color:var(--amber); margin-right:6px;}
.empty{color:var(--muted); font-size:13.5px; font-family:var(--body);}
.note{background:var(--accent-ghost); border:1px solid var(--accent); color:var(--accent-deep); border-radius:var(--radius); padding:11px 13px; font-size:13px; margin-bottom:14px;}

/* ---- toast ---- */
#toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(8px);
  background:var(--ink); color:var(--ground); font-size:13px; font-family:var(--body);
  padding:9px 16px; border-radius:var(--radius); box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:50; max-width:90vw;}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

.foot{margin-top:26px; font-family:var(--mono); font-size:11px; color:var(--faint); text-align:center; line-height:1.7;}

@media (prefers-reduced-motion:no-preference){
  .fade{animation:fade .4s ease both;}
  @keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
}
</style>
</head>
<body>

<div class="wrap" id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";

  // ---------- helpers ----------
  var $ = function(s, r){ return (r||document).querySelector(s); };
  var esc = function(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
  var uid = function(){
    try { return crypto.randomUUID(); } catch(e){}
    return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,8);
  };
  var now = function(){ return Date.now(); };
  async function sha256Hex(str){
    try {
      var enc = new TextEncoder().encode(str);
      var buf = await crypto.subtle.digest("SHA-256", enc);
      return Array.prototype.map.call(new Uint8Array(buf), function(b){ return b.toString(16).padStart(2,"0"); }).join("");
    } catch(e){
      // fallback for contexts without SubtleCrypto — not cryptographically strong,
      // but keeps the account gate working everywhere.
      var h = 0, i, chr;
      for (i=0;i<str.length;i++){ chr = str.charCodeAt(i); h = ((h<<5)-h)+chr; h|=0; }
      return "fb" + Math.abs(h).toString(16);
    }
  }
  var daysAgo = function(ts){ if(!ts) return null; return Math.floor((now()-ts)/86400000); };
  var agoLabel = function(ts){
    var d = daysAgo(ts);
    if (d==null) return "";
    if (d<=0) return "today";
    if (d===1) return "1d ago";
    return d + "d ago";
  };
  var toastTimer;
  function toast(msg){
    var t = $("#toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 3200);
  }
  function sampleErrCopy(code){
    switch(code){
      case "not_granted": case "sampling_disabled": case "not_declared":
        return "Claude isn't available in this view — the tailoring step needs it.";
      case "rate_limited": return "Too many requests just now. Give it a minute and try again.";
      case "session_expired": return "Your Claude session expired — reload the page and sign in again.";
      case "refused": return "Claude declined that request. Try adjusting the job description or résumé.";
      case "prompt_too_large": return "Résumé + job description are too long together. Trim them and retry.";
      case "invalid_json": return "The reply came back malformed. Try again.";
      case "cancelled": return "Stopped.";
      default: return "That didn't go through. Try again in a moment.";
    }
  }

  var STAGES = [
    { key:"saved",     label:"Saved" },
    { key:"tailored",  label:"Tailored" },
    { key:"applied",   label:"Applied" },
    { key:"interview", label:"Interview" },
    { key:"closed",    label:"Closed" }
  ];
  var STAGE_LABEL = {}; STAGES.forEach(function(s){ STAGE_LABEL[s.key] = s.label; });

  // ---------- state ----------
  var state = { profile:{ links:{} }, activity:[], jobs:[] };
  var activeTab = "today";
  var storeReady = false;
  var planCache = { text:"", running:false, ctl:null };

  // ---------- accounts (separate, password-gated data per person — all still
  // local to this browser; there's no server, so this is data separation +
  // a password gate, not bank-grade security) ----------
  var ACCOUNTS_KEY = "career-copilot-accounts-v1";
  var SESSION_KEY = "career-copilot-session-v1";
  var LS_PREFIX = "career-copilot-v1::";
  var currentUser = null;        // account key (lowercased username)
  var currentUserDisplay = "";   // username as typed at registration
  var authState = { mode:"login", error:"", username:"" };

  function loadAccounts(){
    try { var raw = localStorage.getItem(ACCOUNTS_KEY); return raw ? JSON.parse(raw) : {}; } catch(e){ return {}; }
  }
  function saveAccounts(accts){
    try { localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(accts)); } catch(e){}
  }
  function getSession(){ try { return localStorage.getItem(SESSION_KEY) || ""; } catch(e){ return ""; } }
  function setSession(key){ try { localStorage.setItem(SESSION_KEY, key); } catch(e){} }
  function clearSession(){ try { localStorage.removeItem(SESSION_KEY); } catch(e){} }

  function userKey(){ return LS_PREFIX + currentUser; }
  function loadLocal(){
    try { var raw = localStorage.getItem(userKey()); return raw ? JSON.parse(raw) : null; } catch(e){ return null; }
  }
  function saveLocal(){
    try { localStorage.setItem(userKey(), JSON.stringify({ profile:state.profile, activity:state.activity, jobs:state.jobs })); } catch(e){}
  }

  function stripId(j){ var c = Object.assign({}, j); delete c.id; return c; }

  // ---------- persistence (browser-local; no accounts, no server DB) ----------
  async function persistMain(){ saveLocal(); }
  async function persistJob(){ saveLocal(); }
  async function removeJobRemote(){ saveLocal(); }

  async function pushActivity(message, jobId){
    state.activity.unshift({ id:uid(), message:message, jobId:jobId||null, at:now(), read:false });
    state.activity = state.activity.slice(0, 80);
    await persistMain();
  }

  // AI runs through this site's own /api endpoints (a Cloudflare Pages Function
  // backed by Workers AI). If those aren't wired up yet, the AI buttons degrade.
  // GitHub Pages serves static files only — there's no server to run the AI calls,
  // so this build ships with AI off. The tracker, résumé storage, downloads and
  // backup/restore all work fully with zero backend.
  var AI_ENABLED = false;

  async function aiRequest(path, payload, signal){
    var res = await fetch(path, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(payload),
      signal: signal
    });
    if (!res.ok){
      var msg = "AI request failed (" + res.status + ")";
      try { var j = await res.json(); if (j && j.error) msg = j.error; } catch(e){}
      throw new Error(msg);
    }
    return res.json();
  }

  async function initStore(){
    var local = loadLocal();
    if (!local){
      // one-time migration: if this is the very first account ever created on
      // this device and pre-account data exists (from before accounts were
      // added), carry it over instead of losing it.
      try {
        var accts = loadAccounts();
        var oldRaw = localStorage.getItem("career-copilot-v1");
        if (oldRaw && Object.keys(accts).length === 1){
          localStorage.setItem(userKey(), oldRaw);
          local = JSON.parse(oldRaw);
        }
      } catch(e){}
    }
    if (local){
      state.profile = Object.assign({ links:{} }, local.profile || {});
      state.profile.links = state.profile.links || {};
      state.activity = Array.isArray(local.activity) ? local.activity : [];
      state.jobs = Array.isArray(local.jobs) ? local.jobs : [];
    }
    storeReady = true;
    render();
  }

  // ---------- derived ----------
  function counts(){
    var c = { saved:0, tailored:0, applied:0, interview:0, closed:0 };
    state.jobs.forEach(function(j){ if (c[j.status]!=null) c[j.status]++; });
    return c;
  }
  function sortedJobs(){
    var order = { interview:0, tailored:1, saved:2, applied:3, closed:4 };
    return state.jobs.slice().sort(function(a,b){
      var oa = order[a.status]!=null?order[a.status]:9, ob = order[b.status]!=null?order[b.status]:9;
      if (oa!==ob) return oa-ob;
      return (b.updatedAt||b.createdAt||0) - (a.updatedAt||a.createdAt||0);
    });
  }
  function stalledItems(){
    var out = [];
    state.jobs.forEach(function(j){
      if (j.status==="saved" && !j.tailoredResume){
        out.push({ job:j, why:"no materials", tag:"tailor" });
      } else if (j.status==="tailored" && !j.appliedAt){
        var d = daysAgo(j.updatedAt||j.createdAt);
        if (d!=null && d>=2) out.push({ job:j, why:"ready "+d+"d, not applied", tag:"apply" });
      } else if (j.status==="applied" && j.appliedAt){
        var da = daysAgo(j.appliedAt);
        if (da!=null && da>=7) out.push({ job:j, why:"applied "+da+"d ago — follow up", tag:"follow up" });
      }
    });
    return out;
  }
  function unreadCount(){ return state.activity.filter(function(a){ return !a.read; }).length; }

  // ---------- render ----------
  var app = $("#app");

  // ---------- auth ----------
  function renderAuth(){
    var isRegister = authState.mode === "register";
    app.innerHTML =
      '<div class="masthead">' +
        '<div class="brand">' +
          '<h1>Job Search Deck</h1>' +
          '<span class="tag">private pipeline · one account per person</span>' +
        '</div>' +
      '</div>' +
      '<div class="card fade" style="max-width:420px; margin:32px auto 0;">' +
        '<h2>'+ (isRegister ? "Create account" : "Sign in") +'</h2>' +
        '<div class="lede">'+ (isRegister
          ? "Pick a username and password — your pipeline stays private to this account, on this browser."
          : "Each person signs in to their own private pipeline, saved on this device.") +'</div>' +
        (authState.error ? '<div class="note" style="border-color:var(--danger); color:var(--danger); background:var(--danger-ghost);">'+esc(authState.error)+'</div>' : "") +
        '<div class="stack">' +
          '<div><label for="auth-user">Username</label><input id="auth-user" autocomplete="username" value="'+esc(authState.username||"")+'"></div>' +
          '<div><label for="auth-pass">Password</label><input id="auth-pass" type="password" autocomplete="'+(isRegister?"new-password":"current-password")+'"></div>' +
          (isRegister ? '<div><label for="auth-pass2">Confirm password</label><input id="auth-pass2" type="password" autocomplete="new-password"></div>' : "") +
          '<div class="btn-row"><button class="btn-primary" id="auth-submit">'+ (isRegister ? "Create account" : "Log in") +'</button></div>' +
          '<div style="font-size:13px; color:var(--muted);">' +
            (isRegister ? "Already have an account? " : "No account yet? ") +
            '<a href="#" id="auth-switch">'+ (isRegister ? "Log in" : "Register") +'</a>' +
          '</div>' +
        '</div>' +
      '</div>';

    var submit = function(){ isRegister ? handleRegister() : handleLogin(); };
    $("#auth-submit").onclick = submit;
    Array.prototype.forEach.call(app.querySelectorAll("#auth-user, #auth-pass, #auth-pass2"), function(el){
      el.onkeydown = function(e){ if (e.key === "Enter") submit(); };
    });
    $("#auth-switch").onclick = function(e){
      e.preventDefault();
      authState.mode = isRegister ? "login" : "register";
      authState.error = "";
      authState.username = $("#auth-user").value.trim();
      renderAuth();
    };
    $("#auth-user").focus();
  }

  async function handleLogin(){
    var u = $("#auth-user").value.trim();
    var p = $("#auth-pass").value;
    authState.username = u;
    if (!u || !p){ authState.error = "Enter a username and password."; renderAuth(); return; }
    var accounts = loadAccounts();
    var key = u.toLowerCase();
    var acct = accounts[key];
    if (!acct){ authState.error = "No account found for that username."; renderAuth(); return; }
    var hash = await sha256Hex(acct.salt + ":" + p);
    if (hash !== acct.hash){ authState.error = "Incorrect password."; renderAuth(); return; }
    currentUser = key;
    currentUserDisplay = acct.displayName || u;
    setSession(key);
    authState = { mode:"login", error:"", username:"" };
    await initStore();
  }

  async function handleRegister(){
    var u = $("#auth-user").value.trim();
    var p = $("#auth-pass").value;
    var p2 = $("#auth-pass2").value;
    authState.username = u;
    if (!u || u.length < 2){ authState.error = "Username needs at least 2 characters."; renderAuth(); return; }
    if (!/^[a-zA-Z0-9 _-]+$/.test(u)){ authState.error = "Use only letters, numbers, spaces, - or _."; renderAuth(); return; }
    if (!p || p.length < 4){ authState.error = "Password needs at least 4 characters."; renderAuth(); return; }
    if (p !== p2){ authState.error = "Passwords don’t match."; renderAuth(); return; }
    var accounts = loadAccounts();
    var key = u.toLowerCase();
    if (accounts[key]){ authState.error = "That username is already taken — try logging in instead."; renderAuth(); return; }
    var salt = uid();
    var hash = await sha256Hex(salt + ":" + p);
    accounts[key] = { displayName:u, salt:salt, hash:hash, createdAt:now() };
    saveAccounts(accounts);
    currentUser = key;
    currentUserDisplay = u;
    setSession(key);
    authState = { mode:"login", error:"", username:"" };
    await initStore();
  }

  async function buildPlan(){
    if (!AI_ENABLED || planCache.running) return;
    var lines = sortedJobs().map(function(j){
      var bits = "- " + j.title + " @ " + j.company + " | " + STAGE_LABEL[j.status];
      if (j.tailoredResume) bits += " | materials ready";
      var age = agoLabel(j.createdAt); if (age) bits += " | added " + age;
      if (j.appliedAt) bits += " | applied " + agoLabel(j.appliedAt);
      return bits;
    }).join("\n");

    planCache.running = true; planCache.text = ""; planCache.ctl = new AbortController();
    renderToday($("#tab-body"));
    try {
      var res = await aiRequest("/api/plan", {
        pipeline: lines,
        targetRoles: state.profile.targetRoles || "",
        location: state.profile.location || ""
      }, planCache.ctl.signal);
      planCache.text = String(res && res.text || "").trim() || "No plan came back — try again.";
    } catch(e){
      if (!(e && e.name === "AbortError")) toast((e && e.message) || "That didn’t go through. Try again in a moment.");
    } finally {
      planCache.running = false; planCache.ctl = null;
      renderToday($("#tab-body"));
    }
  }

  async function onTailor(id, btn){
    var j = findJob(id);
    if (!j) return;
    if (!AI_ENABLED){ toast("This static site can’t run AI tailoring — draft it yourself or ask an AI assistant directly."); return; }
    var resume = state.profile.resumeText || "";
    if (!resume.trim()){ toast("Add your résumé in the Profile tab first."); activeTab="profile"; render(); return; }

    btn.disabled = true; btn.textContent = "Tailoring…";
    try {
      var data = await aiRequest("/api/tailor", {
        resume: resume.slice(0, 6500),
        title: j.title,
        company: j.company,
        description: (j.description || "").slice(0, 6500)
      });
      j.tailoredResume = String(data && data.resume || "").trim();
      j.coverLetter = String(data && data.coverLetter || "").trim();
      if (!j.tailoredResume && !j.coverLetter) throw new Error("The reply came back empty. Try again.");
      j.updatedAt = now();
      if (j.status==="saved") j.status = "tailored";
      await persistJob(j);
      await pushActivity("Tailored résumé + cover letter for " + j.title + " at " + j.company + ".", id);
      toast("Materials ready — review before you send.");
      render();
    } catch(e){
      toast((e && e.message) || "That didn’t go through. Try again.");
      btn.disabled = false; btn.textContent = j.tailoredResume ? "Re-tailor" : "Tailor résumé + cover letter";
    }
  }

  async function copyText(text){
    try { await navigator.clipboard.writeText(text||""); toast("Copied."); }
    catch(e){ toast("Copy failed — select the text manually."); }
  }
  async function saveFile(name, text){
    text = String(text||"");
    try {
      var blob = new Blob([text], { type: name.slice(-5) === ".json" ? "application/json" : "text/plain" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      return;
    } catch(e){}
    try { await navigator.clipboard.writeText(text); toast("Download blocked — copied to clipboard instead."); return; }
    catch(e){}
    showTextFallback(name, text);
  }
  function showTextFallback(name, text){
    var ov = document.createElement("div");
    ov.style.cssText = "position:fixed; inset:0; background:rgba(10,18,26,.55); z-index:60; display:flex; align-items:center; justify-content:center; padding:20px;";
    ov.innerHTML = '<div style="background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); max-width:640px; width:100%; padding:18px;">' +
      '<div style="font-family:var(--serif); font-weight:600; text-transform:uppercase; letter-spacing:.05em; font-size:13px; margin-bottom:8px;">'+esc(name)+'</div>' +
      '<div style="font-size:12.5px; color:var(--muted); margin-bottom:8px;">Select all and copy — saving files isn’t available in this view.</div>' +
      '<textarea readonly rows="12" style="width:100%; font-family:var(--mono); font-size:12px;"></textarea>' +
      '<div class="btn-row" style="margin-top:10px; justify-content:flex-end;"><button class="btn-ghost" data-x>Close</button></div>' +
    '</div>';
    ov.querySelector("textarea").value = text;
    ov.querySelector("[data-x]").onclick = function(){ ov.remove(); };
    ov.onclick = function(e){ if (e.target===ov) ov.remove(); };
    document.body.appendChild(ov);
    var ta = ov.querySelector("textarea"); ta.focus(); ta.select();
  }

      return;
    }
    b.innerHTML = '<div class="card"><div class="btn-row" style="justify-content:space-between; margin-bottom:12px;">' +
        '<h3>Activity log</h3>' +
        (unreadCount() ? '<button class="btn-ghost" id="a-read" style="font-size:12px; padding:6px 12px;">Mark all read</button>' : "") +
      '</div>' +
      state.activity.map(function(a){
        return '<div style="display:flex; gap:10px; padding:9px 0; border-top:1px solid var(--border);">' +
          '<span class="mono" style="font-size:11px; color:var(--faint); white-space:nowrap; padding-top:2px;">'+
            esc(new Date(a.at).toLocaleDateString([], {month:"short", day:"numeric"})) +'</span>' +
          '<span style="font-size:13.5px;'+ (a.read ? "" : "font-weight:500;") +'">'+esc(a.message)+'</span>' +
        '</div>';
      }).join("") +
    '</div>';
    var r = $("#a-read");
    if (r) r.onclick = async function(){
      state.activity.forEach(function(a){ a.read = true; });
      await persistMain(); render();
    };
  }

  // ---------- theme ----------
  function toggleTheme(){
    var root = document.documentElement;
    var cur = root.getAttribute("data-theme");
    var next;
    if (cur === "dark") next = "light";
    else if (cur === "light") next = "dark";
    else next = matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("career-copilot-theme", next); } catch(e){}
  }
  try {
    var savedTheme = localStorage.getItem("career-copilot-theme");
    if (savedTheme === "light" || savedTheme === "dark") document.documentElement.setAttribute("data-theme", savedTheme);
  } catch(e){}

  // ---------- boot ----------
  (function boot(){
    var session = getSession();
    var accounts = loadAccounts();
    if (session && accounts[session]){
      currentUser = session;
      currentUserDisplay = accounts[session].displayName || session;
      render();
      initStore();
    } else {
      clearSession();
      renderAuth();
    }
  })();
})();
</script>
</body>
</html>
